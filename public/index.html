<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Mission Control</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1215" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%230d1215'/%3E%3Crect y='7.6' width='16' height='0.8' fill='%23000'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23ffb020' font-family='monospace'%3E%E2%9D%AF%3C/text%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/JetBrainsMono-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/JetBrainsMono-Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/JetBrainsMono-Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Oswald';
    src: url('/fonts/Oswald-Variable.woff2') format('woff2');
    font-weight: 200 700; font-style: normal; font-display: swap;
  }
  /* Departures board: blue-black enamel, amber is the loudest color (needs
     you), green is a small "boarding" lamp, red means broken. Prose is the
     system sans, data is JetBrains Mono, and the split-flap status lamp is
     the one place Oswald caps survive. Light theme is the same board on paper. */
  :root {
    --disp-font: 'Oswald', 'Arial Narrow', sans-serif;
    --ui-font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    --mono-font: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --bg: #f1f0eb;
    --surface: #fbfbf8;
    --surface2: #e6e5df;
    --ink: #1b2022;
    --muted: #596264;
    --faint: #8a9193;
    --line: #dddcd4;
    --accent: #1d7a44;
    --warn: #a66a00;
    --bad: #bd3524;
    --chip-bg: #ecebe5;
    --warn-bg: rgba(166, 106, 0, 0.10);
    --accent-bg: rgba(29, 122, 68, 0.08);
    --glow: none;
    --flap: #ecebe5;
    --flap-hi: #f2f1ec;
    --flap-split: rgba(0, 0, 0, 0.10);
    --amber-ink: #f5f4f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1215;
      --surface: #151d22;
      --surface2: #1f292f;
      --ink: #e9e4d6;
      --muted: #93a09e;
      --faint: #5d6b6b;
      --line: #202b31;
      --accent: #46c073;
      --warn: #ffb020;
      --bad: #ff5f45;
      --chip-bg: #1f292f;
      --warn-bg: rgba(255, 176, 32, 0.12);
      --accent-bg: rgba(70, 192, 115, 0.10);
      --glow: 0 0 7px;
      --flap: #151d22;
      --flap-hi: #1c262c;
      --flap-split: rgba(0, 0, 0, 0.45);
      --amber-ink: #0d1215;
    }
  }
  /* Phosphor theme: green-on-black terminal — a deliberate single-look skin,
     so it overrides both light and dark palettes. */
  :root[data-theme="phosphor"] {
    --disp-font: 'JetBrains Mono', ui-monospace, monospace;
    --ui-font: 'JetBrains Mono', ui-monospace, monospace;
    --bg: #050a06;
    --surface: #0a120c;
    --surface2: #122015;
    --ink: #8fdf9a;
    --muted: #55a061;
    --faint: #35603d;
    --line: #16301c;
    --accent: #46e07a;
    --warn: #ffb020;
    --bad: #ff5f45;
    --chip-bg: #122015;
    --warn-bg: rgba(255, 176, 32, 0.10);
    --accent-bg: rgba(70, 224, 122, 0.08);
    --glow: 0 0 8px;
    --flap: #0a120c;
    --flap-hi: #0e1810;
    --flap-split: rgba(0, 0, 0, 0.5);
    --amber-ink: #050a06;
  }
  /* Amber CRT: the VT220's other phosphor. Real amber terminals signaled with
     two intensities, so body text is dim amber, "working" is standard amber,
     and "needs you" is the white-hot bright intensity. Red still means broken. */
  :root[data-theme="amber"] {
    --disp-font: 'JetBrains Mono', ui-monospace, monospace;
    --ui-font: 'JetBrains Mono', ui-monospace, monospace;
    --bg: #0a0602;
    --surface: #140d04;
    --surface2: #1f1508;
    --ink: #d99a3f;
    --muted: #a1712a;
    --faint: #6e4c1a;
    --line: #241708;
    --accent: #ffb020;
    --warn: #ffe6c0;
    --bad: #ff4b33;
    --chip-bg: #1f1508;
    --warn-bg: rgba(255, 230, 192, 0.10);
    --accent-bg: rgba(255, 176, 32, 0.10);
    --glow: 0 0 9px;
    --flap: #140d04;
    --flap-hi: #1b1206;
    --flap-split: rgba(0, 0, 0, 0.5);
    --amber-ink: #0a0602;
  }
  /* Midnight: the board on the night shift. Deep blue-black enamel, frost
     ink, ice-cyan boarding lamp; a warm lantern amber is the one warm thing
     on screen, so "needs you" pops hardest. */
  :root[data-theme="midnight"] {
    --disp-font: 'Oswald', 'Arial Narrow', sans-serif;
    --bg: #0a1220;
    --surface: #111a2c;
    --surface2: #1a2740;
    --ink: #d6e2f0;
    --muted: #8299b5;
    --faint: #4d6076;
    --line: #1c2a42;
    --accent: #5bc8d8;
    --warn: #ffc466;
    --bad: #ff6b5e;
    --chip-bg: #1a2740;
    --warn-bg: rgba(255, 196, 102, 0.12);
    --accent-bg: rgba(91, 200, 216, 0.10);
    --glow: 0 0 6px;
    --flap: #111a2c;
    --flap-hi: #16223a;
    --flap-split: rgba(0, 0, 0, 0.45);
    --amber-ink: #0a1220;
  }
  /* Newsprint: always-light broadsheet. Grey newsprint stock, serif section
     headers, printed-green ink for "boarding", and one red: stop-press red
     for "needs you". Errors are oxblood — a different red, darker. No glow;
     paper doesn't. */
  :root[data-theme="newsprint"] {
    --disp-font: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --bg: #eeebe1;
    --surface: #e6e2d6;
    --surface2: #dbd6c7;
    --ink: #1c1914;
    --muted: #5f594c;
    --faint: #928a79;
    --line: #c9c3b2;
    --accent: #23704b;
    --warn: #c22c1c;
    --bad: #6b1005;
    --chip-bg: #dbd6c7;
    --warn-bg: rgba(194, 44, 28, 0.08);
    --accent-bg: rgba(35, 112, 75, 0.08);
    --glow: none;
    --flap: #e6e2d6;
    --flap-hi: #ece8dd;
    --flap-split: rgba(0, 0, 0, 0.08);
    --amber-ink: #eeebe1;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13.5px/1.5 var(--ui-font);
    padding-bottom: 48px;
    -webkit-font-smoothing: antialiased;
  }
  /* Numbers, costs, branches and commands stay monospaced; prose does not. */
  .mono, code, pre, kbd, .badge, .num { font-family: var(--mono-font); font-variant-numeric: tabular-nums; }
  ::selection { background: var(--warn); color: var(--amber-ink); }

  /* Display face: condensed caps, the board's letter-painted voice. */
  .disp {
    font-family: var(--disp-font);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500;
  }
  /* Split-flap cell: gradient face with the horizontal split line. */
  .flap {
    position: relative; display: inline-flex; align-items: center;
    padding: 2px 9px; border-radius: 2px;
    background: linear-gradient(var(--flap-hi) 0%, var(--flap) 46%, var(--flap) 54%, var(--flap-hi) 100%);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14);
    white-space: nowrap;
  }
  .flap::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--flap-split); pointer-events: none;
  }
  @keyframes flapflip { 0% { transform: rotateX(85deg); } 100% { transform: rotateX(0); } }
  .flap.flip { animation: flapflip 0.3s ease-out; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) { .flap.flip { animation: none; } }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap; row-gap: 10px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header h1 {
    font-size: 15px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap;
  }
  #clock { display: none; }
  #conn {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--faint); flex: none;
  }
  #conn.on { background: var(--accent); box-shadow: var(--glow) var(--accent); }
  #conn.retry { background: var(--warn); }
  .spacer { flex: 1; }

  #quota { display: flex; gap: 20px; align-items: center; font-size: 12.5px; color: var(--muted); }
  #quota.stale { opacity: 0.45; }
  #quota .q-spend { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  #quota .q-spend .num { color: var(--ink); }
  .meter { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .meter .m-pct { color: var(--ink); font-family: var(--mono-font); font-size: 12px; min-width: 3ch; }
  .meter .bar {
    width: 64px; height: 6px; border-radius: 3px;
    background: var(--surface2); overflow: hidden;
  }
  .meter .fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .meter .fill.hot { background: var(--warn); }
  .meter .fill.crit { background: var(--bad); }
  .meter .eta { color: var(--warn); white-space: nowrap; font-family: var(--mono-font); font-size: 12px; }

  /* Section headings: plain sentence case, the count as a quiet number. */
  .sec-head {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    margin-bottom: 10px;
  }
  .sec-head .n { color: var(--faint); font-weight: 500; font-family: var(--mono-font); font-size: 12.5px; }

  /* ---------- live rail ---------- */
  #live {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 18px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  #live .rows { display: flex; flex-direction: column; gap: 6px; }
  .dep-row {
    display: grid;
    grid-template-columns: minmax(140px, 220px) 1fr max-content;
    gap: 2px 18px; align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px 10px 16px;
  }
  .dep-row.waiting { background: var(--warn-bg); border-color: var(--warn); }
  .dep-time { display: none; }
  .dep-proj {
    font-size: 15px; font-weight: 600; line-height: 1.25; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .dep-proj .badge { vertical-align: 1px; font-weight: 400; }
  .dep-mid { min-width: 0; }
  .dep-title {
    font-size: 13.5px; color: var(--ink); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dep-title:hover { color: var(--accent); }
  .dep-task {
    margin-top: 2px; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dep-task .prompt-ch { color: var(--accent); margin-right: 6px; }
  .dep-task .count { color: var(--faint); margin-left: 6px; }
  .dep-reason {
    margin-top: 2px; font-size: 12.5px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dep-reason .glyph { color: var(--warn); margin-right: 6px; font-weight: 600; }
  .dep-right { display: flex; align-items: center; gap: 14px; justify-self: end; }
  .dep-elapsed { color: var(--faint); font-size: 12px; font-family: var(--mono-font); }
  .dep-elapsed.overdue { color: var(--warn); font-weight: 600; }
  .unpriced { color: var(--warn); font-weight: 700; margin-left: 2px; cursor: help; }
  .dep-cost { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; min-width: 52px; font-family: var(--mono-font); }
  .dep-cost-main { color: var(--muted); font-size: 12px; }
  .dep-burn { color: var(--faint); font-size: 10.5px; }
  .ctx { display: inline-flex; flex-direction: column; gap: 3px; min-width: 64px; }
  .ctx-label { font-size: 10.5px; color: var(--faint); text-align: right; white-space: nowrap; font-family: var(--mono-font); }
  .ctx-bar { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .ctx-fill { height: 100%; background: var(--accent); }
  .ctx.warn .ctx-fill { background: var(--warn); }
  .ctx.warn .ctx-label { color: var(--warn); }
  .ctx.bad .ctx-fill { background: var(--bad); }
  .ctx.bad .ctx-label { color: var(--bad); }
  .mc-meta .failed { color: var(--warn); }
  .mc-meta.overdue { color: var(--warn); font-weight: 600; }
  /* The status lamp is the one split-flap left: the loudest thing on screen. */
  .st {
    font-family: var(--disp-font); text-transform: uppercase; font-weight: 500;
    font-size: 11.5px; letter-spacing: 0.12em; padding: 3px 10px 2px;
  }
  .st.st-busy { color: var(--accent); }
  .st.st-waiting {
    background: var(--warn); color: var(--amber-ink); font-weight: 600;
    box-shadow: var(--glow) var(--warn);
  }
  .st.st-waiting::after { background: rgba(0, 0, 0, 0.22); }
  .st.st-quiet { color: var(--warn); }
  .live-none { color: var(--muted); font-size: 13px; }
  .live-none code { color: var(--ink); }

  /* Row actions (rename / open / copy) wait for hover so titles get the room. */
  .acts { display: inline-flex; align-items: center; gap: 2px; flex: none; }
  @media (hover: hover) {
    .acts { opacity: 0; transition: opacity 0.12s; }
    li:hover > .acts, li:focus-within > .acts,
    .dep-row:hover .acts, .dep-row:focus-within .acts,
    .pin-row:hover .acts, .pin-row:focus-within .acts,
    .digest-item:hover .acts, .digest-item:focus-within .acts { opacity: 1; }
  }

  /* In the narrow project cards the actions float over the row's right end. */
  @media (hover: hover) {
    .sessions li { position: relative; }
    .sessions li > .acts {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      padding-left: 28px;
      background: linear-gradient(to right, transparent, var(--surface) 24px);
      pointer-events: none;
    }
    .sessions li:hover > .acts, .sessions li:focus-within > .acts { pointer-events: auto; }
  }
  .hidden-note {
    align-self: flex-start; margin: 6px 0 4px; padding: 2px 0;
    border: none; background: none; cursor: pointer;
    font: 12px var(--ui-font); color: var(--faint);
  }
  .hidden-note:hover { color: var(--accent); }
  .hidden-note:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .sessions + .hidden-note { border-top: 1px solid var(--line); align-self: stretch; text-align: left; padding-top: 8px; margin-top: 0; }
  .d-noise { margin-top: 10px; }
  .d-noise > summary { cursor: pointer; color: var(--faint); font-size: 12.5px; padding: 4px 0; }
  .d-noise > summary:hover { color: var(--ink); }
  .card .new-btn { font-size: 16px; line-height: 1; padding: 2px 7px; color: var(--faint); }
  .card .new-btn:hover { color: var(--accent); }

  /* ---------- project grid ---------- */
  main { padding: 22px 24px; }
  #grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px 8px;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .card .head { display: flex; align-items: center; gap: 8px; }
  .card .name {
    font-weight: 600; font-size: 15px; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .card .name:hover { color: var(--accent); }
  .card .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: var(--glow) var(--accent); }
  .card .spark { margin-left: auto; opacity: 0.8; flex: none; }
  .card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 11.5px; }
  .badge {
    padding: 1px 6px; border-radius: 4px; background: var(--chip-bg); color: var(--muted);
    font-size: 11px; white-space: nowrap;
  }
  .badge.dirty { color: var(--warn); }
  .badge.ahead { color: var(--accent); }
  .badge.err { color: var(--bad); }
  .badge.bg { color: var(--accent); letter-spacing: 0.06em; }
  .badge.missing { color: var(--bad); }
  .badge.changes { cursor: pointer; }
  .note-mark { color: var(--warn); cursor: default; font-size: 12px; flex: none; }
  #note-editor { margin: 10px 0 4px; display: flex; flex-direction: column; gap: 6px; }
  #note-editor textarea {
    width: 100%; min-height: 72px; resize: vertical; box-sizing: border-box;
    font: 12.5px var(--mono-font); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  #note-editor .hint { color: var(--faint); font-size: 11px; }
  .card .when { color: var(--faint); font-size: 11.5px; margin-left: auto; }
  .sessions { list-style: none; padding: 0; margin: 10px 0 0; border-top: 1px solid var(--line); }
  .sessions li {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid var(--line);
    font-size: 13px; min-height: 34px;
  }
  .sessions li:last-child { border-bottom: none; }
  .sessions .s-title, #pinned .s-title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink); flex: 1; min-width: 0;
  }
  .sessions .s-title .wt { color: var(--accent); font-size: 11.5px; margin-right: 5px; }
  .s-when { color: var(--faint); font-size: 11.5px; flex: none; white-space: nowrap; }
  .copy {
    flex: none; border: none; background: none; color: var(--muted);
    font-size: 12px; cursor: pointer; padding: 3px 7px; border-radius: 5px;
    font-family: inherit;
  }
  .copy:hover { background: var(--surface2); color: var(--ink); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .open-btn { color: var(--accent); }
  #open-pref-wrap { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #open-pref-wrap[hidden] { display: none; }
  #open-pref {
    font: inherit; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px;
  }
  #search {
    font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; width: 260px; margin-left: 10px;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #search::placeholder { color: var(--faint); }
  /* A full set of meters needs room; tighten before the header wraps. */
  @media (max-width: 1500px) {
    header { gap: 12px; }
    #search { width: 180px; }
    #open-pref-wrap .open-label { display: none; }
    #quota { gap: 14px; }
    .meter .bar { width: 44px; }
    #wk-chart { display: none; }
  }
  .hd-btn {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 6px 8px; border-radius: 6px;
  }
  .hd-btn:hover { background: var(--surface2); color: var(--ink); }
  .hd-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #bell-btn { position: relative; }
  #bell-badge {
    position: absolute; top: -2px; right: -2px;
    background: var(--warn); color: var(--amber-ink);
    font: 700 9.5px var(--mono-font);
    border-radius: 8px; padding: 1px 4px; min-width: 10px; text-align: center;
  }

  /* settings drawer */
  .set-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .set-row:last-child { border-bottom: none; }
  .set-row .set-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-row .set-sub { color: var(--faint); font-size: 11px; display: block;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-row input[type="text"] {
    font: inherit; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; width: 170px;
  }
  .set-row select {
    font: inherit; color: var(--ink); background: var(--surface2);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px;
  }
  .set-row input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }

  /* clickable session titles */
  .s-title[data-session], .di-title[data-session] { cursor: pointer; }
  .s-title[data-session]:hover, .di-title[data-session]:hover { color: var(--accent); }

  /* inline session rename (pencil button swaps the title for this input) */
  .rename-input {
    font: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--surface2); border: 1px solid var(--accent);
    border-radius: 6px; padding: 2px 6px; flex: 1; min-width: 0; width: 100%;
    box-sizing: border-box;
  }
  .rename-input:focus { outline: none; }

  /* transcript rendering */
  .t-turn { margin: 10px 0; }
  .t-user {
    background: var(--accent-bg); border: 1px solid var(--line);
    border-radius: 3px; padding: 8px 12px; font-size: 13px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .t-user .t-who { color: var(--accent); font-size: 11.5px; font-weight: 600; display: block; margin-bottom: 3px; }
  .t-tool {
    font-family: inherit; font-size: 11.5px;
    color: var(--muted); padding: 1px 0 1px 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .t-tool .t-tname { color: var(--accent); }
  .t-note {
    border-left: 3px solid var(--warn); padding: 6px 10px; margin: 10px 0;
    color: var(--muted); font-size: 12.5px; background: var(--warn-bg); border-radius: 0 2px 2px 0;
  }
  .t-ts { color: var(--faint); font-size: 10px; margin: 12px 0 2px; }

  /* header weekly trend */
  #wk-chart rect:hover { opacity: 0.75; }
  .none-yet { color: var(--faint); font-size: 12px; padding: 10px 0 4px; }

  /* ---------- pinned strip ---------- */
  #pinned { margin-bottom: 22px; }
  #pinned .pin-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; margin-bottom: 6px; min-height: 38px;
  }
  #pinned .pin-row .star { color: var(--warn); flex: none; }

  /* ---------- day timeline ---------- */
  .tl-lane { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tl-name {
    flex: none; width: 110px; font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tl-track {
    position: relative; flex: 1; height: 16px;
    background: var(--surface); border-radius: 2px; overflow: hidden;
  }
  .tl-bar {
    position: absolute; top: 3px; bottom: 3px; border-radius: 2px;
    background: var(--accent); opacity: 0.8; cursor: pointer; min-width: 3px;
  }
  .tl-bar:hover { opacity: 1; }
  .tl-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
  .s-role { color: var(--faint); margin-right: 4px; }

  /* ---------- git attention strip ---------- */
  #git-attn {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
    border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 8px;
    background: var(--surface);
    padding: 10px 16px; margin-bottom: 22px;
    font-size: 13px;
  }
  #git-attn .ga-label { color: var(--ink); font-weight: 600; white-space: nowrap; }
  #git-attn .ga-item { color: var(--muted); white-space: nowrap; }
  #git-attn .ga-item .badge { margin-left: 5px; }

  /* ---------- digest ---------- */
  #digest { margin-bottom: 28px; }
  #digest summary, #dormant summary {
    cursor: pointer; user-select: none; list-style: none;
    display: flex; align-items: center; gap: 12px;
  }
  #digest summary::-webkit-details-marker, #dormant summary::-webkit-details-marker { display: none; }
  #digest summary .sec-head, #dormant summary .sec-head { margin-bottom: 0; }
  .sec-head .caret {
    display: inline-block; width: 10px; color: var(--faint); font-size: 10px;
    transition: transform 0.12s;
  }
  details[open] > summary .caret { transform: rotate(90deg); }
  #digest-range { display: none; padding: 2px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
  #digest[open] #digest-range { display: inline-flex; }
  #digest-range button {
    font: 12px var(--ui-font); color: var(--muted);
    background: none; border: none; border-radius: 5px; cursor: pointer;
    padding: 3px 10px;
  }
  #digest-range button:hover { color: var(--ink); }
  #digest-range button.sel { background: var(--surface2); color: var(--ink); }
  #digest-body { margin-top: 12px; }
  .digest-day {
    color: var(--muted); font-size: 12.5px; font-weight: 500;
    margin: 16px 0 8px;
  }
  .digest-day:first-child { margin-top: 0; }
  .digest-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 6px;
  }
  .digest-item .di-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .digest-item .di-proj {
    font-weight: 600; font-size: 13.5px; flex: none;
    max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .digest-item .di-title { color: var(--muted); font-size: 13.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .digest-item .di-when { color: var(--faint); font-size: 11.5px; font-family: var(--mono-font); white-space: nowrap; flex: none; }
  .digest-item .di-summary {
    margin-top: 6px; font-size: 13px; color: var(--ink); line-height: 1.55; max-width: 110ch;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer;
  }
  .digest-item .di-summary.expanded { display: block; }
  .digest-item .di-tasks { margin-top: 5px; font-size: 12px; color: var(--faint); }
  .digest-item .di-tasks .done { color: var(--accent); }
  .digest-empty { color: var(--faint); font-size: 13px; padding: 6px 0; }

  /* ---------- dormant ---------- */
  #dormant { margin-top: 32px; }
  #grid + #dormant summary .sec-head { color: var(--muted); }
  #dormant .cards { margin-top: 12px; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  #dormant .card { opacity: 0.75; }

  /* ---------- mission control ---------- */
  #mc {
    position: fixed; inset: 0; z-index: 15;
    background: var(--bg);
    display: flex; flex-direction: column;
  }
  #mc[hidden] { display: none !important; }
  .mc-head {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px; border-bottom: 1px solid var(--line);
    background: var(--surface); flex: none;
  }
  .mc-title { font-size: 15px; font-weight: 650; }
  .mc-sub { color: var(--faint); font-size: 12px; }
  #mc-grid {
    flex: 1; overflow-y: auto;
    display: grid; gap: 10px; padding: 14px 20px;
    grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
    align-content: start;
  }
  #mc-grid .mc-empty { color: var(--faint); font-size: 13px; padding: 24px 0; }
  .mc-pane {
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    height: min(46vh, 480px); min-width: 0;
  }
  .mc-pane.waiting { box-shadow: inset 0 2px 0 var(--warn); }
  .mc-pane-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none;
    min-width: 0;
  }
  .mc-pane-head .mc-proj { min-width: 0; flex: 0 1 auto; }
  .mc-stats { flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-width: 0; }
  .mc-pane-head .mc-proj {
    font-weight: 600; font-size: 14.5px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mc-pane-head .mc-proj:hover { color: var(--warn); }
  .mc-pane-head .mc-meta { color: var(--faint); font-size: 11px; white-space: nowrap; }
  .mc-pane-head .spacer { flex: 1; min-width: 6px; }
  .mc-pane-task {
    padding: 4px 12px; border-bottom: 1px solid var(--line); flex: none;
    font-size: 11.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mc-pane-task .prompt-ch { color: var(--accent); margin-right: 6px; }
  .mc-pane-body { flex: 1; overflow-y: auto; padding: 6px 12px 10px; font-size: 12px; }
  .mc-pane-body .t-turn { margin-top: 8px; }

  /* ---------- hive: one character card per live session ---------- */
  #hive {
    position: fixed; inset: 0; z-index: 15;
    background: var(--bg); overflow-y: auto;
  }
  #hive[hidden] { display: none !important; }
  #hive .mc-head { position: sticky; top: 0; z-index: 1; }
  .hv-tiles {
    display: grid; gap: 10px; padding: 14px 20px 0;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .hv-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
  .hv-tile .k { color: var(--muted); font-size: 12px; font-weight: 500; }
  .hv-tile .v { font-family: var(--disp-font); font-size: 26px; font-weight: 500; line-height: 1.15; }
  .hv-tile .s { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hv-tile.warn .v, .hv-tile .eta { color: var(--warn); }
  .hv-grid {
    display: grid; gap: 12px; padding: 12px 20px 20px;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    align-items: start;
  }
  .hv-empty { color: var(--faint); font-size: 13px; padding: 24px 20px; }
  .hv-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0;
    border-top: 3px solid var(--hue); display: flex; flex-direction: column;
  }
  .hv-card.waiting { border-top-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-bg); }
  .hv-top { display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 6px; }
  .hv-avatar { flex: none; width: 64px; height: 64px; }
  .hv-who { flex: 1; min-width: 0; }
  .hv-name {
    font-weight: 700; font-size: 14px; line-height: 1.3; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .hv-name:hover { color: var(--warn); }
  .hv-persona { color: var(--muted); font-style: italic; font-size: 12px; margin-top: 2px; cursor: help; }
  .hv-proj { color: var(--faint); font-size: 11px; margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .hv-rank { flex: none; text-align: right; }
  .hv-rank .n { font-family: var(--disp-font); font-size: 30px; font-weight: 600; line-height: 1; padding: 2px 8px; }
  .hv-rank .gap { color: var(--faint); font-size: 10.5px; margin-top: 5px; white-space: nowrap; }
  .hv-rank .gap.lead { color: var(--accent); }
  .hv-money { display: flex; align-items: baseline; gap: 10px; padding: 4px 14px 10px; flex-wrap: wrap; }
  .hv-money .big { font-family: var(--disp-font); font-size: 38px; font-weight: 500; line-height: 1; }
  .hv-money .rate { color: var(--muted); font-size: 12px; }
  .hv-state {
    margin: 0 14px; padding: 7px 10px; border-radius: 6px; background: var(--surface2);
    display: flex; gap: 10px; align-items: center; min-width: 0; font-size: 12px;
  }
  .hv-state .txt { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hv-card.waiting .hv-state { background: var(--warn-bg); }
  .hv-card.waiting .hv-state .txt { color: var(--ink); }
  .hv-sec { padding: 12px 14px 0; }
  .hv-label { color: var(--muted); font-size: 12px; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
  .hv-call { margin-top: 5px; font-size: 13px; display: flex; gap: 6px; min-width: 0; }
  .hv-call .verb { color: var(--muted); flex: none; }
  .hv-call .tgt { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hv-call.fresh .tgt { color: var(--accent); }
  .hv-trail { margin-top: 4px; font-size: 11.5px; }
  .hv-trail div { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hv-trail div:nth-child(2) { opacity: 0.75; }
  .hv-trail div:nth-child(3) { opacity: 0.5; }
  .hv-task { margin-top: 6px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hv-task .prompt-ch { color: var(--accent); margin-right: 6px; }
  .hv-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 14px 0; }
  .hv-bar .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .hv-bar .row b { color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .hv-bar .track { height: 4px; background: var(--surface2); margin-top: 5px; border-radius: 2px; overflow: hidden; }
  .hv-bar .fill { display: block; height: 100%; background: var(--hue); }
  .hv-bar.warn .fill { background: var(--warn); }
  .hv-bar.bad .fill { background: var(--bad); }
  .hv-foot {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 12px 14px 12px; margin-top: 12px; border-top: 1px solid var(--line);
  }
  .hv-foot .k { color: var(--muted); font-size: 12px; }
  .hv-foot .v { font-size: 13px; margin-top: 2px; }
  .hv-foot .v.bad { color: var(--bad); }
  .hv-note { color: var(--faint); font-size: 11px; padding: 0 20px 24px; }
  .fm-sum { color: var(--muted); font-size: 12px; margin: 4px 0 14px; }
  .fm-award { margin: 0 0 18px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .fm-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .fm-title { font-size: 16px; font-weight: 650; }
  .fm-blurb { color: var(--faint); font-size: 11.5px; flex: 1; min-width: 0; }
  .fm-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
  .fm-head + .fm-row { border-top: none; margin-top: 6px; }
  .fm-row .flap { font-family: var(--disp-font); font-weight: 600; font-size: 14px; flex: none; }
  .fm-row.first .flap { color: var(--warn); font-size: 18px; }
  .fm-row .hv-avatar { width: 32px; height: 32px; }
  .fm-row.first .hv-avatar { width: 44px; height: 44px; }
  .fm-who { flex: 1; min-width: 0; }
  .fm-who .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; font-size: 13px; }
  .fm-row.first .fm-who .t { font-weight: 700; }
  .fm-who .t:hover { color: var(--warn); }
  .fm-who .p { color: var(--faint); font-size: 11px; }
  .fm-val { flex: none; font-size: 12.5px; text-align: right; }
  .fm-row.first .fm-val { color: var(--warn); font-weight: 700; }
  .fm-share img { width: 100%; border-radius: 6px; border: 1px solid var(--line); margin-top: 10px; }
  .fm-period button.on { color: var(--warn); border-color: var(--warn); }
  @keyframes hvblink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .hv-avatar .eyes { transform-box: fill-box; transform-origin: center; animation: hvblink 4.5s infinite; }
  @media (prefers-reduced-motion: reduce) { .hv-avatar .eyes { animation: none; } }

  .mc-agents .agents { max-height: 160px; overflow-y: auto; }
  .agents { padding: 4px 12px 6px; border-bottom: 1px solid var(--line); font-size: 11.5px; flex: none; }
  .agents .team { color: var(--muted); font-size: 12px; font-weight: 500; margin-bottom: 2px; }
  .agents .agent { display: flex; align-items: center; gap: 7px; line-height: 1.6; }
  .agents .swatch { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .agents .aname { color: var(--ink); }
  .agents .atype { color: var(--faint); }
  .agents .astatus { margin-left: auto; color: var(--faint); }
  .agents .astatus.active { color: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .agents summary { cursor: pointer; list-style: none; color: var(--faint); font-size: 10.5px; }
  #drawer .agents { padding: 6px 0 4px; border-bottom: none; }

  /* ---------- project detail drawer ---------- */
  #drawer-backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0, 0, 0, 0.35);
  }
  /* display:flex below would otherwise override the hidden attribute */
  #drawer[hidden], #drawer-backdrop[hidden] { display: none !important; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 21;
    width: min(760px, 92vw);
    background: var(--bg); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    box-shadow: -16px 0 48px rgba(0, 0, 0, 0.35);
  }
  #drawer .d-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 16px 22px 12px; border-bottom: 1px solid var(--line);
  }
  #drawer .d-head h2 { font-size: 17px; font-weight: 650; }
  #drawer .d-head .d-path {
    color: var(--faint); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  #drawer .d-actions { display: flex; gap: 2px; align-items: center; flex: none; }
  #drawer .d-close {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 18px; padding: 2px 8px; border-radius: 6px;
  }
  #drawer .d-close:hover { background: var(--surface2); color: var(--ink); }
  #drawer .d-body { overflow-y: auto; padding: 6px 22px 40px; }
  .d-section { margin-top: 18px; }
  .d-section > summary {
    cursor: pointer; user-select: none; list-style: none;
    font-size: 13px; font-weight: 600;
    color: var(--muted); padding: 4px 0;
  }
  .d-section > summary::before { content: '▸ '; }
  .d-section[open] > summary::before { content: '▾ '; }
  .d-section .d-empty { color: var(--faint); font-size: 12.5px; padding: 4px 0; }
  .d-file {
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
    padding: 12px 16px; margin-top: 8px;
  }
  .d-file .d-file-name {
    font-family: inherit;
    font-size: 12px; color: var(--accent); margin-bottom: 6px;
  }
  .d-sessions li { display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; min-height: 36px; }
  .d-sessions .s-title {
    flex: 1; min-width: 0; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .d-sessions li:last-child { border-bottom: none; }
  .d-sessions { list-style: none; padding: 0; margin: 6px 0 0; }

  /* rendered markdown */
  .md { font-size: 13px; line-height: 1.55; color: var(--ink); overflow-wrap: break-word; }
  .md h1, .md h2, .md h3, .md h4 { margin: 12px 0 4px; line-height: 1.3; }
  .md h1 { font-size: 15px; } .md h2 { font-size: 14px; } .md h3, .md h4 { font-size: 13px; }
  .md p { margin: 6px 0; }
  .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md code {
    font-family: inherit; font-size: 12px;
    background: var(--surface2); padding: 1px 4px; border-radius: 4px;
  }
  .md pre {
    background: var(--surface2); border-radius: 6px; padding: 10px 12px;
    overflow-x: auto; margin: 8px 0;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line); margin: 6px 0; padding-left: 10px; color: var(--muted); }
  .md a { color: var(--accent); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }

  .hl-flash { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* ---------- session changes panel ---------- */
  .badge.changes { color: var(--accent); cursor: pointer; }
  #changes-panel { margin-top: 10px; }
  .d-section-title { font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 0; }
  .chg-file { border: 1px solid var(--line); border-radius: 3px; margin-top: 8px; background: var(--surface); }
  .chg-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 12.5px; }
  .chg-head .chg-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .chg-head .add { color: var(--accent); }
  .chg-head .del { color: var(--bad); }
  .chg-head .badge { flex: none; }
  .chg-body { border-top: 1px solid var(--line); overflow-x: auto; }
  .chg-versions { display: flex; gap: 2px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  .chg-versions button.sel { background: var(--surface2); color: var(--ink); }
  .diff { font-size: 11.5px; line-height: 1.5; margin: 0; padding: 6px 0; }
  .diff .hh { color: var(--faint); background: var(--surface2); padding: 2px 12px; margin: 4px 0; }
  .diff .dl { display: grid; grid-template-columns: 44px 44px 1fr; white-space: pre; }
  .diff .dl .ln { color: var(--faint); text-align: right; padding-right: 8px; user-select: none; }
  .diff .dl.add { background: var(--accent-bg); }
  .diff .dl.add .tx { color: var(--accent); }
  .diff .dl.del { background: rgba(189, 53, 36, 0.10); }
  .diff .dl.del .tx { color: var(--bad); }
  .diff .dl .tx { padding-left: 8px; }
  .chg-note { color: var(--faint); font-size: 12px; padding: 8px 12px; }

  /* ---------- stats drawer ---------- */
  #wk-chart { cursor: pointer; }
  .heat {
    display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(7, 11px); gap: 3px;
    margin-top: 10px; overflow-x: auto; padding-bottom: 4px;
  }
  .heat .hc { width: 11px; height: 11px; border-radius: 2px; background: var(--surface2); }
  .wh { display: grid; grid-template-columns: 28px repeat(24, 1fr); gap: 3px; margin-top: 10px; align-items: center; }
  .wh .wh-day { color: var(--faint); font-size: 10px; }
  .wh .hc { height: 11px; border-radius: 2px; background: var(--surface2); }
  .hours { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-top: 10px; }
  .hours .hb { flex: 1; background: var(--accent); border-radius: 1px 1px 0 0; min-height: 2px; }
  .hours-labels { display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; margin-top: 3px; }
  .stat-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .stat-table td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .stat-table td:last-child, .stat-table td:nth-child(2) { text-align: right; color: var(--muted); }
  .ts-audit { margin: 0 0 10px; padding-left: 18px; font-size: 12px; color: var(--warn); }
  .ts-audit li.info { color: var(--muted); }
  .ts-table td { text-align: left; }
  .ts-table td:last-child { text-align: right; width: 32px; }
  .ts-table td:nth-child(2) { text-align: left; white-space: nowrap; }
  .ts-state { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); }
  .ts-state.on { color: var(--accent); }
  .ts-state.off { color: var(--faint); }
  .ts-src { font-size: 11px; color: var(--faint); margin-left: 6px; }
  .ts-shadow { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .ts-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .ts-kind summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  #usage-panel { margin: 0 0 14px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; }
  .usage-table td { text-align: right; }
  .usage-table td:first-child { text-align: left; }
  .usage-table tr.h td { color: var(--faint); font-size: 11px; border-bottom: 1px solid var(--line); }
  .usage-foot { margin-top: 8px; font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .stat-totals { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .stat-totals strong { color: var(--ink); }
  .inv-chip { padding: 0 6px; border-radius: 2px; font-size: 11px; background: var(--chip-bg); color: var(--muted); }
  .inv-chip.on { color: var(--accent); }
  .inv-chip.stale, .inv-chip.auth { color: var(--warn); }
  .inv-chip.off { color: var(--faint); }

  /* ---------- command palette ---------- */
  #palette-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.4); }
  #palette {
    position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); z-index: 31;
    width: min(620px, 92vw);
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.45);
  }
  #palette input {
    width: 100%; font: 14px 'JetBrains Mono', ui-monospace, monospace;
    background: none; border: none; outline: none; color: var(--ink);
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  #palette-list { list-style: none; margin: 0; padding: 6px 0; max-height: 46vh; overflow-y: auto; }
  #palette-list li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 16px; font-size: 12.5px; cursor: pointer;
  }
  #palette-list li .pk { color: var(--accent); flex: none; width: 14px; }
  #palette-list li .pl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #palette-list li .ph { color: var(--faint); font-size: 11px; flex: none; }
  #palette-list li.sel { background: var(--accent-bg); }
  #palette-list li.sel .pl { color: var(--accent); }
  #palette-empty { color: var(--faint); font-size: 12px; padding: 12px 16px; }

  /* ---------- first-run guide ---------- */
  #guide {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px 14px; margin-bottom: 22px;
  }
  #guide .g-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  #guide .g-head h2 { font-size: 14px; font-weight: 600; }
  #guide .g-head .g-sub { color: var(--faint); font-size: 12.5px; }
  #guide .g-head .spacer { flex: 1; }
  #guide .g-done {
    font: 500 12.5px var(--ui-font); color: var(--amber-ink); background: var(--accent);
    border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  #guide .g-done:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #guide .g-grid { display: grid; gap: 12px 24px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  #guide .g-item { font-size: 13px; color: var(--muted); line-height: 1.5; }
  #guide .g-item b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  #guide .g-lamps { gap: 6px; }
  #guide .g-lamps li { align-items: flex-start; }
  #guide .g-lamps .flap { flex: none; min-width: 84px; justify-content: center; }
  #guide kbd {
    font-size: 11.5px; color: var(--ink); background: var(--surface2);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
  }
  #guide .g-icons { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; }
  #guide .g-icons li { display: flex; align-items: center; gap: 8px; }
  #guide .g-icons svg { flex: none; color: var(--ink); }

  /* welcome card for fresh installs */
  #welcome {
    grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line);
    border-radius: 3px; padding: 26px 30px; line-height: 1.7;
  }
  #welcome h2 { font-size: 14px; margin-bottom: 8px; }
  #welcome h2 .tilde { color: var(--accent); }

  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 7px 14px; border-radius: 6px; font-size: 12.5px;
    opacity: 0; transition: opacity 0.18s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ---------- phones: everything in one column, nothing scrolls sideways ---------- */
  @media (max-width: 700px) {
    header { padding: 10px 16px; gap: 8px 10px; }
    header h1 { font-size: 15px; margin-right: auto; }
    #search { order: 9; flex: 1 1 100%; width: auto; min-width: 0; margin-left: 0; }

    #live { padding: 12px 16px; position: static; } /* a sticky rail would cover most of a phone screen */
    main { padding: 14px 16px; }
    .dep-row { grid-template-columns: 1fr; padding: 10px 12px; }
    .dep-proj { font-size: 15px; }
    .dep-mid, .dep-right { grid-column: 1 / -1; }
    .dep-right { justify-self: stretch; flex-wrap: wrap; gap: 6px 10px; }
    .dep-title, .dep-reason { white-space: normal; overflow-wrap: anywhere; }
    #pinned .pin-row { flex-wrap: wrap; padding: 7px 12px; }
    .digest-item .di-top { flex-wrap: wrap; row-gap: 2px; }
    .digest-item .di-proj { max-width: none; flex: 1 1 auto; }
    .digest-item .di-title { order: 9; flex: 1 1 100%; }
    #git-attn .ga-item { white-space: normal; }
    #drawer { width: 100vw; border-left: none; }
    #drawer .d-head { flex-wrap: wrap; padding: 12px 16px 10px; }
    #drawer .d-head h2 { font-size: 15px; flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
    #drawer .d-head .d-path { display: none; }
    #drawer .d-actions { flex-wrap: wrap; order: 3; flex: 1 1 100%; }
    #drawer .d-actions:empty { display: none; }
    #drawer .d-body { padding: 6px 16px 40px; }
    #drawer pre, #mc pre { max-width: 100%; overflow-x: auto; }
    #drawer code { overflow-wrap: anywhere; }
    #mc-grid { grid-template-columns: 1fr; padding: 12px 16px; }
    .hv-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px 16px 0; }
    .hv-tile:last-child:nth-child(odd) { grid-column: span 2; }
    .fm-award { padding: 10px 12px; }
    .fm-head .fm-title { flex: 1; }
    .fm-blurb { flex: 1 1 100%; order: 3; }
    .hv-grid { grid-template-columns: 1fr; padding: 12px 16px 16px; }
    .hv-note { padding: 0 16px 24px; }
    .hv-money .big { font-size: 32px; }
    .heat { max-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div id="conn" title="connection"></div>
  <h1>Claude Mission Control</h1>
  <input id="search" type="search" placeholder="Search sessions" aria-label="Search sessions" autocomplete="off">
  <div class="spacer"></div>
  <label id="open-pref-wrap"><span class="open-label">Open in</span>
    <select id="open-pref" aria-label="Open sessions in">
      <option value="terminal">Terminal</option>
    </select>
  </label>
  <div id="quota"></div>
  <span id="clock" class="flap" title="board time"></span>
  <button id="mc-btn" class="hd-btn" title="Mission Control: every live session side by side" aria-label="Mission Control"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="5" height="5" rx="1"/><rect x="9" y="2.5" width="5" height="5" rx="1"/><rect x="2" y="9.5" width="5" height="5" rx="1"/><rect x="9" y="9.5" width="5" height="5" rx="1"/></svg></button>
  <button id="hive-btn" class="hd-btn" title="Hive: every live session as a character card" aria-label="Hive"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8 13.4 4.9v6.2L8 14.2 2.6 11.1V4.9Z"/></svg></button>
  <button id="bell-btn" class="hd-btn" title="Catch up on what happened while you were away" aria-label="Catch up"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.2 1.5H2.8Z"/><path d="M6.5 14a1.6 1.6 0 0 0 3 0"/></svg><span id="bell-badge" hidden></span></button>
  <button id="gear" class="hd-btn" title="Settings" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>

<section id="live"></section>

  <section id="guide" hidden aria-label="How to read this board"></section>

  <details id="digest" open>

      </span>
    </summary>

  </details>
  <div class="sec-head" id="grid-head" hidden>Projects <span class="n"></span></div>

<div id="palette-backdrop" hidden></div>
<div id="palette" hidden>
  <input id="palette-input" type="text" placeholder="Jump to a project, session, or action…" autocomplete="off">
  <ul id="palette-list"></ul>
</div>
<div id="mc" hidden>

    <span class="mc-title">Mission Control</span>

    <span class="mc-title">Hive</span>

  </div>
  <div class="d-body" id="d-body"></div>
