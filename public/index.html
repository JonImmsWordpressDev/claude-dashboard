// One-click self-update. The server decides what to run from its own install
// location; we just kick it off and wait for the new version to come back up.
async function applyUpdate(out, currentVersion) {
  out.textContent = 'updating…';
  let startPid = null;
  try {
    startPid = (await (await fetch('/api/health', { cache: 'no-store' })).json()).pid || null;
  } catch {}
  let r;
  try {
    r = await (await fetch('/api/update', { method: 'POST' })).json();
  } catch {
    out.textContent = "couldn't reach the server";
    return;
  }
  if (r.manual) { out.textContent = r.manual; return; }
  if (!r.ok) { out.textContent = `update failed: ${r.error || 'unknown error'}`; return; }
  if (r.unchanged) {
    out.textContent = r.kind === 'npm'
      ? 'nothing newer on npm yet — the release may still be publishing, try again in a few minutes'
      : 'nothing new arrived — try again later';
    return;
  }
  if (!r.willRestart) {
    out.textContent = `updated to ${r.version || 'the new version'} — restart the dashboard to finish`;
    return;
  }
  out.textContent = 'updated — restarting…';
  // The old process exits moments after replying; poll health until a
  // different server answers — new version, new pid, or back up after a
  // visible down-gap (pid catches a fast relaunch the version can't).
  const t0 = Date.now();
  let sawDown = false;
  (async function poll() {
    try {
      const h = await (await fetch('/api/health', { cache: 'no-store' })).json();
      if (h.version !== currentVersion || (startPid && h.pid && h.pid !== startPid) || sawDown) {
        location.reload();
        return;
      }
    } catch {
      sawDown = true;
    }
    if (Date.now() - t0 < 60000) setTimeout(poll, 1500);
    else out.textContent = "server didn't come back — check the logs";
  })();
}

// Swap a session title for a text input. Enter/blur saves, Escape cancels,
// an empty name goes back to the automatic title.
function startRename(btn) {
  const id = btn.dataset.renameSession;
  const row = btn.closest('li, .pin-row, .dep-row');
  const titleEl = row && row.querySelector(`[data-session="${CSS.escape(id)}"]`);
  if (!titleEl || row.querySelector('.rename-input')) return;
  const before = btn.dataset.title || '';
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.type = 'text';
  input.maxLength = 80;
  input.value = before;
  input.placeholder = 'Session name — leave empty to reset';
  titleEl.hidden = true;
  titleEl.after(input);
  input.focus();
  input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const val = input.value.trim();
    input.remove();
    titleEl.hidden = false;
    if (save && val !== before) {
      try {
        const r = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ renameSession: id, name: val }),
        });
        const out = await r.json();
        if (out.ok) {
          // Drawers aren't re-rendered by SSE, so patch the title in place.
          const text = [...titleEl.childNodes].find((n) => n.nodeType === 3);
          if (text) text.textContent = out.title; else titleEl.append(out.title);
          btn.dataset.title = out.title;
          toast(val ? `Renamed to "${val}"` : 'Name reset to the automatic title');
        } else toast(`Couldn't rename: ${out.error}`);
      } catch {
        toast("Couldn't reach the server");
      }
    }
    if (renderDeferred && lastState) render(lastState);
  };
  input.addEventListener('keydown', (e) => {
    e.stopPropagation(); // keep the page's shortcuts (Esc, /, etc.) out of the edit
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}

async function saveSetting(endpoint, payload, note) {
  try {
    const r = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const out = await r.json();
    toast(out.ok ? note : `Couldn't save: ${out.error}`);
    return out.ok;
  } catch {
    toast("Couldn't reach the server");
    return false;
  }
}

    $('#set-idle').addEventListener('change', (e) => {

document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-note-toggle]')) { openNoteEditor(); return; }
  if (e.target.closest('[data-usage-toggle]')) { toggleUsagePanel(); return; }
  const pin = e.target.closest('[data-pin]');
  if (pin) {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pinSession: pin.dataset.pin }),
    }).then((x) => x.json()).catch(() => null);
    if (r && r.ok) {
      toast(r.pinned ? 'Pinned to the top of the dashboard' : 'Unpinned');
      if (pin.closest('#drawer')) pin.textContent = r.pinned ? '★ pinned' : '☆ pin';
    } else {
      toast("Couldn't update the pin");
    }
    return;
  }
  if (e.target.closest('[data-replay]')) {
    if (replay) stopReplay(true);
    else startReplay();
    return;
  }
  const mb = e.target.closest('[data-mute]');
  if (mb) {
    const muted = !mb.dataset.muted;
    const ok = await saveSetting('/api/config', { mutePath: mb.dataset.mute, muted },
      muted ? 'Notifications muted for this project' : 'Notifications unmuted');
    if (ok) {
      mb.dataset.muted = muted ? '1' : '';
      mb.textContent = muted ? '🔕 muted — click to unmute' : '🔔 notifying — click to mute';
    }
    return;
  }
  const cc = e.target.closest('[data-changes]');
  if (cc) { openTranscript(cc.dataset.changes, null, { changes: true }); return; }
  const ct = e.target.closest('[data-changes-toggle]');
  if (ct) { chg.open ? closeChanges() : openChanges(ct.dataset.changesToggle); return; }
  const co = e.target.closest('[data-chg-open]');
  if (co) {
    const bodyEl = co.parentElement.querySelector('.chg-body');
    if (!bodyEl.hidden) { bodyEl.hidden = true; return; }
    const f = ($('#changes-panel')._files || [])[Number(co.dataset.chgOpen)];
    loadFileDiff(chg.sid, Number(co.dataset.chgOpen), f ? f.versions[0] : 1, 'disk');
    return;
  }
  const cd = e.target.closest('[data-chg-diff]');
  if (cd) { loadFileDiff(chg.sid, Number(cd.dataset.chgDiff), cd.dataset.from, cd.dataset.to); return; }
  const rb = e.target.closest('[data-rename-session]');
  if (rb) { startRename(rb); return; }
  const t = e.target.closest('[data-session]');
  if (t) { openTranscript(t.dataset.session, t.dataset.hl); return; }
  const nb = e.target.closest('[data-new]');
  if (nb) {
    nb.disabled = true;
    try {
      const r = await fetch('/api/open', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newSession: true, projectPath: nb.dataset.new, target: 'terminal' }),
      });
      const out = await r.json();
      toast(out.ok ? 'Opening a new session in Ghostty…' : `Couldn't open: ${out.error}`);
    } catch {
      toast("Couldn't reach the server");
    }
    nb.disabled = false;
  }
});

// ---------- stats view ----------
async function openStats() {
  openDrawerShell('Stats', 'all projects, ignored ones excluded');
  try {
    const r = await fetch('/api/stats');
    if (!r.ok) throw new Error();
    const s = await r.json();
    const max = Math.max(1, ...s.days.map((d) => d.c));
    // pad so weeks align into columns (Sunday-first)
    const pad = new Date(s.days[0].t).getDay();
    const cells = Array(pad).fill('<span class="hc" style="visibility:hidden"></span>').concat(
      s.days.map((d) => {
        const date = new Date(d.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const style = d.c ? `background:var(--accent);opacity:${(0.25 + 0.75 * (d.c / max)).toFixed(2)}` : '';
        return `<span class="hc" style="${style}" title="${esc(`${date}: ${d.c} prompt${d.c === 1 ? '' : 's'}`)}"></span>`;
      })
    );
    const hmax = Math.max(1, ...s.hours);
    const hourBars = s.hours.map((c, h) =>
      `<span class="hb" style="height:${Math.max(4, Math.round((c / hmax) * 100))}%${c ? '' : ';background:var(--surface2)'}"
        title="${esc(`${h}:00 — ${c} prompts`)}"></span>`).join('');
    const heat = s.heat || [];
    const wmax = Math.max(1, ...heat.flat());
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const whCells = heat.map((row, d) =>
      `<span class="wh-day">${dayNames[d]}</span>` + row.map((c, h) => {
        const style = c ? `background:var(--accent);opacity:${(0.25 + 0.75 * (c / wmax)).toFixed(2)}` : '';
        return `<span class="hc" style="${style}" title="${esc(`${dayNames[d]} ${h}:00 — ${c} prompt${c === 1 ? '' : 's'}`)}"></span>`;
      }).join('')
    ).join('');
    const costDays = s.costDays || [];
    const cmax = Math.max(0.01, ...costDays.map((d) => d.cost));
    const costBars = costDays.map((d) => {
      const date = new Date(d.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      return `<span class="hb" style="height:${Math.max(4, Math.round((d.cost / cmax) * 100))}%${d.cost ? '' : ';background:var(--surface2)'}"
        title="${esc(`${date} — ≈$${d.cost.toFixed(2)} · ${(d.tokens / 1e6).toFixed(1)}M tok`)}"></span>`;
    }).join('');
    const costStart = costDays.length
      ? new Date(costDays[0].t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
    const models = Object.entries(s.byModel).sort((a, b) => b[1].cost - a[1].cost);
    const modelRows = models.map(([m, e]) => `<tr>
      <td>${esc(m)}</td>
      <td>${(e.tokens / 1e6).toFixed(1)}M tok</td>
      <td>≈$${e.cost.toFixed(2)}</td>
    </tr>`).join('');
    const projRows = (s.perProject || []).map((p) => {
      const parts = Object.entries(p.models)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3)
        .map(([m, c]) => `${esc(modelShort(m))} ${Math.round((c / p.total) * 100)}%`)
        .join(' · ');
      return `<tr><td>${esc(p.name)}</td><td style="text-align:left;color:var(--muted)">${parts}</td><td>≈$${p.total.toFixed(2)}</td></tr>`;
    }).join('');
    const topRows = (s.topSessions || []).map((t) => `<tr>
      <td><span class="s-title" data-session="${esc(t.sessionId)}" title="Click to read the transcript">${esc(t.title)}</span>
        <span class="set-sub">${esc(t.projectName)}${t.model ? ` · ${esc(modelShort(t.model))}` : ''}</span></td>
      <td>${relTime(t.lastActivityAt)}</td>
      <td>≈$${t.cost.toFixed(2)}</td></tr>`).join('');
    $('#d-body').innerHTML =
      '<div style="margin-top:10px"><button class="copy" data-week>your week with Claude →</button></div>' +
      dSection('Activity — last 26 weeks', `<div class="heat">${cells.join('')}</div>`) +
      dSection('Busiest hours', `<div class="hours">${hourBars}</div>
        <div class="hours-labels"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>`) +
      dSection('Weekly rhythm — prompts by day and hour', heat.length ? `<div class="wh">${whCells}</div>` : null, 'No activity yet.') +
      dSection('Spend — last 90 days', costDays.length ? `<div class="hours">${costBars}</div>
        <div class="hours-labels"><span>${esc(costStart)}</span><span>today</span></div>` : null, 'No usage recorded yet.') +
      dSection('By model — all time', models.length ? `<table class="stat-table">${modelRows}</table>` : null, 'No usage recorded yet.') +
      dSection('Most expensive sessions', topRows ? `<table class="stat-table">${topRows}</table>` : null, 'No sessions costed yet.') +
      dSection('Models by project', projRows ? `<table class="stat-table">${projRows}</table>` : null, 'No project usage yet.') +
      `<div class="stat-totals"><strong>${s.totals.sessions}</strong> sessions · <strong>${s.totals.prompts}</strong> prompts · <strong>≈$${s.totals.cost}</strong> ${esc(costWording().noun)}, all time</div>`;
  } catch {
    $('#d-body').innerHTML = '<div class="d-empty" style="padding:20px 0">Couldn\'t load stats.</div>';
  }
}

// ---------- day timeline ----------
async function openTimeline() {
  openDrawerShell('Last 24 hours', 'one lane per project · amber ticks = needed you');
  try {
    const r = await fetch('/api/stats');
    if (!r.ok) throw new Error();
    const s = await r.json();
    const now = Date.now();
    const t0 = now - 24 * 3600000;
    const pct = (t) => Math.max(0, Math.min(100, ((t - t0) / (now - t0)) * 100));
    const byProject = new Map();
    for (const row of s.timeline || []) {
      if (!byProject.has(row.project)) byProject.set(row.project, []);
      byProject.get(row.project).push(row);
    }
    const ticks = (lastState?.events || [])
      .filter((e) => e.kind === 'needs you' && e.at >= t0);
    const lanes = [...byProject.entries()].map(([proj, rows]) => {
      const bars = rows.map((row) => `<span class="tl-bar" data-session="${esc(row.sessionId)}"
        title="${esc(`${row.title} — ${new Date(row.start).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}–${new Date(row.end).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}`)}"
        style="left:${pct(row.start).toFixed(1)}%;width:${Math.max(0.8, pct(row.end) - pct(row.start)).toFixed(1)}%"></span>`).join('');
      const marks = ticks.filter((e) => e.project === proj)
        .map((e) => `<span class="tl-tick" title="${esc(`needed you — ${relTime(e.at)}`)}" style="left:${pct(e.at).toFixed(1)}%"></span>`).join('');
      return `<div class="tl-lane"><span class="tl-name disp">${esc(proj)}</span><div class="tl-track">${bars}${marks}</div></div>`;
    }).join('');
    const hourMarks = [-24, -18, -12, -6, 0].map((h) =>
      `<span>${new Date(now + h * 3600000).toLocaleTimeString(undefined, { hour: 'numeric' })}</span>`).join('');
    $('#d-body').innerHTML = lanes
      ? `<div style="margin-top:12px">${lanes}</div><div class="hours-labels" style="margin-left:120px">${hourMarks}</div>`
      : '<div class="d-empty" style="padding:20px 0">No sessions in the last 24 hours.</div>';
  } catch {
    $('#d-body').innerHTML = '<div class="d-empty" style="padding:20px 0">Couldn\'t load the timeline.</div>';
  }
}

// ---------- catch-up bell ----------
function seenAt() { return Number(localStorage.getItem('claudeDashSeenAt') || 0); }

function renderBell(state) {
  const unseen = (state.events || []).filter((e) => e.at > seenAt()).length;
  const b = $('#bell-badge');
  b.hidden = !unseen;
  if (unseen) b.textContent = unseen > 9 ? '9+' : String(unseen);
}

function openCatchUp() {
  openDrawerShell('Catch-up', 'notification history since the server started');
  const events = (lastState && lastState.events) || [];
  const since = seenAt();
  const rows = events.map((e) => `
    <li ${e.at > since ? 'style="border-left:2px solid var(--warn);padding-left:8px"' : ''}>
      <span class="flap disp st" style="flex:none">${esc(e.kind)}</span>
      <span class="s-title">${esc(e.project)} — ${esc(e.body)}</span>
      <span class="s-when">${relTime(e.at)}</span>

    : '<div class="d-empty" style="padding:20px 0">Nothing yet — waiting, stuck, and budget events will show up here.</div>';
  localStorage.setItem('claudeDashSeenAt', String(Date.now()));
  renderBell(lastState || {});
}

$('#bell-btn').addEventListener('click', openCatchUp);

let weekReport = null;
async function openWeekReport() {
  openDrawerShell('Your week with Claude', 'trailing 7 days · ignored projects excluded');
  try {
    const r = await fetch('/api/stats');
    if (!r.ok) throw new Error();
    const s = await r.json();
    const w = s.week || {};
    const b = lastState && lastState.budget;
    const waitTotal = (w.waits || []).reduce((a, x) => a + x, 0);
    const rows = [
      ['Sessions', String(w.sessions ?? 0)],
      ['Prompts', String(w.prompts ?? 0)],
      [costWording().noun.replace(/^./, (c) => c.toUpperCase()), `≈$${(w.cost || 0).toFixed(2)}${b ? ` of your $${b.limit} budget` : ''}`],
      ['Busiest day', w.busiestDay || '—'],
      ['Busiest hour', w.busiestHour != null ? `${w.busiestHour}:00` : '—'],
      ['Models', (w.models || []).map(modelShort).join(' · ') || '—'],
      ['Cache hit rate', w.cacheHitRatio != null ? `${Math.round(w.cacheHitRatio * 100)}% of input tokens served from cache` : 'not enough data yet'],
      ['Your typical reply time', w.typicalWait ? `${w.typicalWait} (${waitTotal} prompts measured)` : 'not enough data yet'],
    ];
    weekReport = { w, b, rows, days: (s.costDays || []).slice(-7) };
    const table = `<table class="stat-table">${rows.map(([k, v]) =>

// ---------- share card: the week as a 1200×630 PNG ----------
// Always drawn in the dark departures palette so shared cards look alike.
const CARD = { w: 1200, h: 630, bg: '#0d1215', flap: '#151d22', flapHi: '#1c262c', split: 'rgba(0,0,0,0.45)', ink: '#e9e4d6', muted: '#93a09e', faint: '#5d6b6b', line: '#202b31', green: '#46c073', amber: '#ffb020' };
let shareCanvas = null;
let shareName = 'card.png';

async function renderShareCard() {
  const { w, days } = weekReport;
  await Promise.all(['700 140px Oswald', '500 20px "JetBrains Mono"'].map((f) => document.fonts.load(f).catch(() => {})));
  const c = document.createElement('canvas');
  c.width = CARD.w * 2;
  c.height = CARD.h * 2;
  const g = c.getContext('2d');
  g.scale(2, 2);
  const oswald = (px, wt = 600) => `${wt} ${px}px Oswald, "Arial Narrow", sans-serif`;
  const mono = (px, wt = 500) => `${wt} ${px}px "JetBrains Mono", ui-monospace, monospace`;
  const text = (s, x, y, font, color, align = 'left', spacing = 0) => {
    g.font = font; g.fillStyle = color; g.textAlign = align;
    if ('letterSpacing' in g) g.letterSpacing = `${spacing}px`;
    g.fillText(s, x, y);
    if ('letterSpacing' in g) g.letterSpacing = '0px';
  };
  const flap = (x, y, fw, fh) => {
    g.fillStyle = CARD.flap; g.beginPath(); g.roundRect(x, y, fw, fh, 6); g.fill();
    g.fillStyle = CARD.flapHi; g.beginPath(); g.roundRect(x, y, fw, fh / 2, [6, 6, 0, 0]); g.fill();
    g.fillStyle = CARD.split; g.fillRect(x, y + fh / 2 - 0.5, fw, 1.5);
  };

  g.fillStyle = CARD.bg; g.fillRect(0, 0, CARD.w, CARD.h);

  // header
  const end = new Date();
  const start = new Date(end.getTime() - 6 * 86400000);
  const md = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  text('❯ MY WEEK WITH CLAUDE CODE', 64, 92, oswald(30), CARD.amber, 'left', 2);
  text(`${md(start)} – ${md(end)}, ${end.getFullYear()}`, CARD.w - 64, 90, mono(18), CARD.muted, 'right');
  g.fillStyle = CARD.line; g.fillRect(64, 116, CARD.w - 128, 2);

  // the number
  const cost = w.cost || 0;
  const money = cost >= 10 ? Math.round(cost).toLocaleString() : cost.toFixed(2);
  const pv = w.planValue;
  text(pv ? 'LIST-PRICE VALUE' : 'ESTIMATED COST', 64, 172, mono(16), CARD.muted, 'left', 2);
  text(`≈$${money}`, 58, 312, oswald(150, 700), CARD.ink);
  if (pv && pv.multiple >= 1.1) text(`${pv.multiple}× the ${pv.label} plan's weekly price`, 64, 358, mono(22), CARD.amber);
  else if (pv) text(`on the ${pv.label} plan`, 64, 358, mono(22), CARD.muted);

  // daily bars
  const bx = 700, by = 150, bw = 436, bh = 200;
  const max = Math.max(...days.map((d) => d.cost), 0.01);
  const slot = bw / 7;
  const busiest = days.reduce((i, d, j) => (d.cost > days[i].cost ? j : i), 0);
  days.forEach((d, i) => {
    const x = bx + i * slot + 8;
    const colW = slot - 16;
    flap(x, by, colW, bh);
    const fh = d.cost > 0 ? Math.max(4, (d.cost / max) * (bh - 8)) : 0;
    g.fillStyle = i === busiest && d.cost > 0 ? CARD.amber : CARD.green;
    g.beginPath(); g.roundRect(x + 4, by + bh - 4 - fh, colW - 8, fh, 3); g.fill();
    text(new Date(d.t).toLocaleDateString(undefined, { weekday: 'narrow' }), x + colW / 2, by + bh + 28, mono(16), CARD.muted, 'center');
  });

  // stat flaps
  const stats = [
    ['SESSIONS', String(w.sessions ?? 0)],
    ['PROMPTS', String(w.prompts ?? 0)],
    ['CACHE HITS', w.cacheHitRatio != null ? `${Math.round(w.cacheHitRatio * 100)}%` : '—'],
    ['BUSIEST', w.busiestDay ? w.busiestDay.slice(0, 3) + (w.busiestHour != null ? ` ${w.busiestHour}:00` : '') : '—'],
  ];
  const sw = (CARD.w - 128 - 3 * 20) / 4;
  stats.forEach(([label, value], i) => {
    const x = 64 + i * (sw + 20);
    flap(x, 410, sw, 110);
    text(value, x + 22, 476, oswald(46, 600), CARD.ink);
    text(label, x + 22, 506, mono(13), CARD.muted, 'left', 2);
  });

  // footer
  text((w.models || []).map(modelShort).join(' · '), 64, 578, mono(16), CARD.faint);
  text('npx claude-mission-control', CARD.w - 64, 578, mono(16), CARD.muted, 'right');

  shareCanvas = c;
  shareName = `week-with-claude-${new Date().toISOString().slice(0, 10)}.png`;
  return c.toDataURL('image/png');
}

// Titles are often a raw first prompt; keep home paths off a shareable image.
function cardSafe(s) {
  return String(s || '').replace(/\/(Users|home)\/[^/\s]+/g, '~').replace(/[A-Z]:\\Users\\[^\\\s]+/gi, '~');
}

function avatarImage(id) {
  const svg = hvAvatar(id, '')
    .replace('class="hv-avatar" ', 'xmlns="http://www.w3.org/2000/svg" width="240" height="240" ')
    .replaceAll('var(--bg)', CARD.bg).replaceAll('var(--ink)', CARD.ink).replaceAll('var(--warn)', CARD.amber);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

async function renderFameCard(award) {
  await Promise.all(['700 140px Oswald', '500 20px "JetBrains Mono"'].map((f) => document.fonts.load(f).catch(() => {})));
  const c = document.createElement('canvas');
  c.width = CARD.w * 2;
  c.height = CARD.h * 2;
  const g = c.getContext('2d');
  g.scale(2, 2);
  const oswald = (px, wt = 600) => `${wt} ${px}px Oswald, "Arial Narrow", sans-serif`;
  const mono = (px, wt = 500) => `${wt} ${px}px "JetBrains Mono", ui-monospace, monospace`;
  const text = (str, x, y, font, color, align = 'left', spacing = 0) => {
    g.font = font; g.fillStyle = color; g.textAlign = align;
    if ('letterSpacing' in g) g.letterSpacing = `${spacing}px`;
    g.fillText(str, x, y);
    if ('letterSpacing' in g) g.letterSpacing = '0px';
  };
  const fit = (str, max, font) => {
    g.font = font;
    let t = str;
    while (t.length > 1 && g.measureText(t).width > max) t = t.slice(0, -2) + '…';
    return t;
  };
  const win = award.entries[0];

  g.fillStyle = CARD.bg; g.fillRect(0, 0, CARD.w, CARD.h);
  text('❯ HALL OF FAME', 64, 92, oswald(30), CARD.amber, 'left', 2);
  text(famePeriod(fame.days).toUpperCase(), CARD.w - 64, 90, mono(18), CARD.muted, 'right', 2);
  g.fillStyle = CARD.line; g.fillRect(64, 116, CARD.w - 128, 2);

  text(award.title.toUpperCase(), 58, 222, oswald(84, 700), CARD.ink, 'left', 1);
  text(award.blurb, 64, 266, mono(20), CARD.muted);

  const av = await avatarImage(win.sessionId);
  g.fillStyle = CARD.flap; g.beginPath(); g.roundRect(64, 300, CARD.w - 128, 170, 8); g.fill();
  if (av) g.drawImage(av, 88, 318, 134, 134);
  text(fit(cardSafe(win.title), CARD.w - 128 - 200 - 260, mono(26, 700)), 246, 362, mono(26, 700), CARD.ink);
  text(fit(`${win.projectName}${win.model ? ' · ' + modelShort(win.model) : ''}`, 560, mono(18)), 246, 398, mono(18), CARD.muted);
  text(win.label, CARD.w - 92, 400, oswald(50, 600), CARD.amber, 'right');
  text('#1', CARD.w - 92, 346, oswald(26, 600), CARD.muted, 'right');

  award.entries.slice(1).forEach((e, i) => {
    const y = 516 + i * 34;
    text(`#${i + 2}`, 64, y, oswald(22, 600), CARD.faint);
    text(fit(`${cardSafe(e.title)} · ${e.projectName}`, 760, mono(17)), 110, y, mono(17), CARD.muted);
    text(e.label, CARD.w - 64, y, mono(17), CARD.muted, 'right');
  });

  text('npx claude-mission-control', CARD.w - 64, 606, mono(16), CARD.muted, 'right');
  shareCanvas = c;
  shareName = `hall-of-fame-${award.key}.png`;
  return c.toDataURL('image/png');
}

  try {
    const r = await fetch(`/api/session?id=${encodeURIComponent(exportableSession.id)}`);
    const t = await r.json();
    const lines = [`# ${t.title}`, '', `_${t.projectName} — exported from Claude Mission Control, ${new Date().toLocaleString()}_`, ''];
    for (const ev of t.events) {
      if (ev.kind === 'user') lines.push(`**You:** ${ev.text}`, '');
      else if (ev.kind === 'assistant') lines.push(ev.text, '');
      else if (ev.kind === 'tool') lines.push(`> ⚙ \`${ev.name}\` ${ev.input || ''}`, '');
      else if (ev.kind === 'note') lines.push(`> **Recap:** ${ev.text}`, '');
    }
    const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${t.title.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').slice(0, 60) || 'session'}.md`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Transcript downloaded');

// ---------- command palette (⌘K) ----------
const pal = { items: [], sel: 0 };

function paletteItems(q) {
  const items = [];
  const st = lastState || { projects: [], liveSessions: [] };
  items.push({ k: '⚙', label: 'Settings', hint: 'rename, hide, terminal, notifications', run: openSettings });
  items.push({ k: '?', label: 'Show the guide', hint: 'what the lamps, rows and buttons do', run: () => { showGuide(true, true); window.scrollTo({ top: 0 }); } });
  items.push({ k: '▦', label: 'Mission Control', hint: 'every live session at once', run: openMissionControl });
  items.push({ k: '⬢', label: 'Hive', hint: 'live sessions as characters · who is winning', run: openHive });
  items.push({ k: '★', label: 'Hall of Fame', hint: 'your best sessions by award · share cards', run: () => openFame() });
  items.push({ k: '▲', label: 'Stats', hint: 'heatmap · models · hours', run: openStats });
  items.push({ k: '⌗', label: 'Plugins & MCP', hint: 'what is installed, enabled, needs auth', run: openInventory });
  items.push({ k: '☰', label: 'Your week with Claude', hint: '7-day report · export', run: openWeekReport });
  items.push({ k: '━', label: 'Day timeline', hint: 'last 24h, lane per project', run: openTimeline });
  items.push({ k: '💬', label: 'Claude.ai chats', hint: 'imported from your export', run: openChats });
  items.push({ k: '🔔', label: 'Catch-up', hint: 'notification history', run: openCatchUp });
  for (const l of st.liveSessions || []) {
    items.push({ k: '●', label: `Watch live: ${l.projectName} — ${l.title || ''}`, hint: l.status, run: () => openTranscript(l.sessionId) });
  }
  for (const p of st.projects || []) {
    items.push({ k: '❯', label: p.name, hint: 'project details', run: () => openDetail(p.path, p.name) });
    items.push({ k: '⊕', label: `New session in ${p.name}`, hint: 'terminal', run: () =>
      fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newSession: true, projectPath: p.path, target: 'terminal' }) })
        .then((r) => r.json()).then((o) => toast(o.ok ? 'Opening new session…' : `Couldn't open: ${o.error}`)) });
    for (const s of p.sessions) {
      items.push({ k: '·', label: `${p.name}: ${s.title}`, hint: relTime(s.lastActivityAt), run: () => openTranscript(s.sessionId) });
    }
  }
  if (!q) return items.filter((i) => ['⚙', '▲', '⌗', '●', '❯'].includes(i.k)).slice(0, 12);
  const needle = q.toLowerCase();
  const scored = [];
  for (const it of items) {
    const l = it.label.toLowerCase();
    let score = -1;
    if (l.includes(needle)) score = 100 - l.indexOf(needle);
    else {
      // subsequence match
      let i = 0;
      for (const ch of l) if (ch === needle[i]) i++;
      if (i === needle.length) score = 10;
    }
    if (score >= 0) scored.push([score, it]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  const out = scored.slice(0, 11).map(([, it]) => it);
  out.push({ k: '🔎', label: `Search all prompts for "${q}"`, hint: 'Enter', run: () => runSearch(q) });
  return out;
}

function renderPalette() {
  const list = $('#palette-list');
  if (!pal.items.length) {
    list.innerHTML = '<div id="palette-empty">Nothing matches.</div>';
    return;
  }
  list.innerHTML = pal.items.map((it, i) => `
    <li class="${i === pal.sel ? 'sel' : ''}" data-pi="${i}">
      <span class="pk">${it.k}</span><span class="pl">${esc(it.label)}</span><span class="ph">${esc(it.hint || '')}</span>
    </li>`).join('');
  list.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}

function openPalette() {
  closeDetail();
  $('#palette').hidden = false;
  $('#palette-backdrop').hidden = false;
  const input = $('#palette-input');
  input.value = '';
  pal.sel = 0;
  pal.items = paletteItems('');
  renderPalette();
  input.focus();
}

function closePalette() {
  $('#palette').hidden = true;
  $('#palette-backdrop').hidden = true;
}

function runPaletteSelection(i) {
  const it = pal.items[i];
  if (!it) return;
  closePalette();
  it.run();
}

$('#palette-input').addEventListener('input', (e) => {
  pal.items = paletteItems(e.target.value.trim());
  pal.sel = 0;
  renderPalette();
});
$('#palette-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); pal.sel = Math.min(pal.sel + 1, pal.items.length - 1); renderPalette(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); pal.sel = Math.max(pal.sel - 1, 0); renderPalette(); }
  else if (e.key === 'Enter') runPaletteSelection(pal.sel);
  else if (e.key === 'Escape') closePalette();
});
$('#palette-list').addEventListener('click', (e) => {
  const li = e.target.closest('[data-pi]');
  if (li) runPaletteSelection(Number(li.dataset.pi));
});
$('#palette-backdrop').addEventListener('click', closePalette);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    $('#palette').hidden ? openPalette() : closePalette();
  }
});

          <li>${icon('mc-btn')} Mission Control: every live session side by side</li>
          <li>${icon('hive-btn')} Hive: live sessions ranked, plus Hall of Fame</li>
          <li>${icon('bell-btn')} Catch up on what happened while you were away</li>
          <li>${icon('gear')} Settings, themes and your phone view</li>
        </ul></div>
    </div>`;
}
function showGuide(show, focus = false) {
  const g = $('#guide');
  if (show) {
    g.innerHTML = renderGuide();
    g.hidden = false;
    if (focus) $('#guide-done').focus({ preventScroll: true });
  } else g.hidden = true;
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('#guide-done')) return;
  try { localStorage.setItem('guideSeen', '1'); } catch {}
  showGuide(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== '?' || e.metaKey || e.ctrlKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  e.preventDefault();
  showGuide($('#guide').hidden, true);
  if (!$('#guide').hidden) window.scrollTo({ top: 0 });
});
if (!guideSeen()) showGuide(true);

poll();
connect();
setInterval(poll, 60_000);
// keep relative times fresh even without state changes
setInterval(() => { if (lastState) render(lastState); }, 30_000);
</script>
</body>
</html>
