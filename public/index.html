<script>
'use strict';

const $ = (s, el) => (el || document).querySelector(s);

// Write innerHTML only when the generated HTML actually changed — rebuilding
// identical DOM every SSE tick is what caused hover flicker.
function patch(el, html) {
  if (el._h !== html) {
    el._h = html;
    el.innerHTML = html;
  }
}

// Board clock. The cell flips on the minute, like everything else up there.
function tickClock() {
  const el = $('#clock');
  const t = new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
  if (el.textContent !== t) {
    el.textContent = t;
    el.classList.remove('flip');
    void el.offsetWidth;
    el.classList.add('flip');
  }
}
setInterval(tickClock, 1000);
tickClock();

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function relTime(ms) {
  if (!ms) return '';
  const d = Date.now() - ms;
  const m = Math.floor(d / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const days = Math.floor(h / 24);
  if (days < 30) return days + 'd ago';
  const mo = Math.floor(days / 30);
  return mo + 'mo ago';
}

function elapsed(ms) {
  if (!ms) return '';
  const s = Math.floor((Date.now() - ms) / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function waitLabel(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return `waiting ${h ? `${h}h ${m}m` : `${m}m`}`;
}

// 14-day activity sparkline: thin columns, native tooltips per day.
function sparkSVG(counts) {
  const w = 84, h = 26, n = counts.length, bw = 4, gap = (w - n * bw) / (n - 1);
  const max = Math.max(1, ...counts);
  let bars = '';
  for (let i = 0; i < n; i++) {
    const v = counts[i];
    const bh = v ? Math.max(3, Math.round((v / max) * (h - 4))) : 2;
    const x = Math.round(i * (bw + gap));
    const day = new Date(Date.now() - (n - 1 - i) * 86400000);
    const label = `${day.getMonth() + 1}/${day.getDate()}: ${v} prompt${v === 1 ? '' : 's'}`;
    bars += `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" rx="1.5"
      fill="${v ? 'var(--accent)' : 'var(--line)'}"><title>${esc(label)}</title></rect>`;
  }
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img"
    aria-label="prompts per day, last 14 days">${bars}</svg>`;
}

// 8-week cost trend, one bar per week, oldest left.
function weeklyChart(weeks) {
  if (!weeks || !weeks.some((v) => v > 0)) return '';
  const w = 62, h = 20, bw = 5, n = weeks.length, gap = (w - n * bw) / (n - 1);
  const max = Math.max(...weeks);
  let bars = '';
  for (let i = 0; i < n; i++) {
    const v = weeks[i];
    const bh = v ? Math.max(2, Math.round((v / max) * (h - 2))) : 1;
    const x = Math.round(i * (bw + gap));
    const ago = n - 1 - i;
    const label = `${ago === 0 ? 'this week' : ago === 1 ? 'last week' : ago + ' weeks ago'}: ≈$${v.toFixed(0)}`;
    bars += `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" rx="1.5"
      fill="${v ? 'var(--accent)' : 'var(--line)'}"><title>${esc(label)}</title></rect>`;
  }
  return `<svg id="wk-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img"
    aria-label="${esc(costWording().noun)} per week, last 8 weeks">${bars}</svg>`;
}

function meter(label, pct, title, extra = '') {
  const cls = pct >= 90 ? 'crit' : pct >= 75 ? 'hot' : '';
  return `<div class="meter" title="${esc(title || '')}">
    <span>${esc(label)}</span>
    <span class="bar"><span class="fill ${cls}" style="width:${Math.min(100, pct)}%"></span></span>
    <span class="m-pct">${Math.round(pct)}%</span>${extra}
  </div>`;
}

// Limit forecast for a usage meter: an amber "→ 3:40 PM" when the current
// pace runs out before the reset, and the projection in the tooltip.
function forecastMeter(label, pct, resetsRaw, f) {
  const sameDay = (ms) => new Date(ms).toDateString() === new Date().toDateString();
  const when = (ms) => (sameDay(ms) ? '' : new Date(ms).toLocaleDateString(undefined, { weekday: 'short' }) + ' ') + fmtWhen(ms);
  const parsed = Date.parse(resetsRaw);
  const resetAt = resetsRaw ? (Number.isFinite(parsed) ? when(parsed) : resetsRaw) : '';
  const resets = resetAt ? 'resets ' + resetAt : '';
  if (!f) return meter(label, pct, resets);
  const pace = f.basis === 'recent' ? 'at your recent pace' : 'at your average pace this window';
  if (!f.hitAt) {
    return meter(label, pct, `${resets} · ${pace}, about ${f.projected}% by then`);
  }
  const early = Math.max(0, Math.round((f.resetsAt - f.hitAt) / 60000));
  const earlyTxt = early >= 1440 ? `${Math.floor(early / 1440)}d ${Math.floor((early % 1440) / 60)}h` : early >= 60 ? `${Math.floor(early / 60)}h ${early % 60}m` : `${early}m`;
  const title = f.utilization >= 100
    ? `limit reached · ${resets}`
    : `${pace}, you hit 100% around ${when(f.hitAt)}, ${earlyTxt} before the reset${resetAt ? ' at ' + resetAt : ''}`;
  return meter(label, pct, title, `<span class="eta">→ ${esc(when(f.hitAt))}</span>`);
}

// One display line for what a waiting session needs: glyph + 80-char text,
// plus the untruncated version for tooltips.
function reasonLine(r) {
  if (!r || !r.text) return null;
  const glyph = r.kind === 'question' ? '?' : r.kind === 'permission' ? '🔒' : '';
  const opts = r.kind === 'question' && r.options && r.options.length ? r.options.join(' / ') : '';
  const full = opts ? `${r.text} · ${opts}` : r.text;
  const short = full.length > 80 ? full.slice(0, 79) + '…' : full;
  return { glyph, short, full, opts, text: r.text };
}

// Status cell: a split-flap that flips when the status actually changes.
// keyPrefix keeps rail and mission-control flips independent.
const prevStatusUI = new Map(); // key -> status
function statusFlap(s, keyPrefix = '') {
  const key = keyPrefix + s.sessionId;
  const changed = prevStatusUI.has(key) && prevStatusUI.get(key) !== s.status;
  prevStatusUI.set(key, s.status);
  const flip = changed ? ' flip' : '';
  if (s.status === 'waiting') {
    const rl = reasonLine(s.waitingReason);
    return `<span class="flap disp st st-waiting${flip}" title="${esc(rl ? rl.full : 'Claude is waiting for your input')}">needs you</span>`;
  }
  if (s.status === 'busy') {
    const quiet = s.quietMin
      ? ` <span class="flap disp st st-quiet" title="Busy but no transcript output for ${s.quietMin} minutes — may be stalled">quiet ${s.quietMin}m</span>`
      : '';
    return `<span class="flap disp st st-busy${flip}">busy</span>${quiet}`;
  }
  return `<span class="flap disp st${flip}">${esc(s.status)}</span>`;
}

// "claude-fable-5" -> "fable-5"; date-suffixed ids lose the date.
function modelShort(m) {
  if (!m) return '';
  return m.replace(/^claude-/, '').replace(/-\d{8}$/, '');
}

// Tooltip for a clickable session title; the model rides along instead of a chip.
function titleTip(m, action = 'Click to read the transcript') {
  return m ? `${modelShort(m)}. ${action}` : action;
}

function modelChip(m) {
  return m ? `<span class="badge" title="${esc(m)}">${esc(modelShort(m))}</span>` : '';
}

function fmtCost(usd) {
  if (!usd || usd < 0.005) return '';
  return usd >= 100 ? `$${Math.round(usd)}` : `$${usd.toFixed(2)}`;
}

// Every cost figure is a list-price estimate. On API billing that is an
// estimate of the invoice; on a subscription it is a relative weight.
function costWording() {
  const api = lastState?.plan?.billing === 'api';
  return api
    ? { noun: 'estimated cost', tip: 'Estimated from token counts at Anthropic list prices. Your invoice is the source of truth.' }
    : { noun: 'list-price value', tip: 'What these tokens would cost at API list price. On a subscription this is a relative weight, not a bill.' };
}

const UNPRICED_TIP = 'A model in this session is not in this version\'s rate table; Opus-tier rate assumed. Update the dashboard or set modelPricing in config.json.';

// One chip for every cost figure: same wording, same tooltip, same marker.
function costChip(usd, { cls = 's-when', assumed = false, before = '', after = '' } = {}) {
  const f = fmtCost(usd);
  if (!f) return '';
  const w = costWording();
  const tip = `${w.noun} — ${w.tip}${assumed ? ` ${UNPRICED_TIP}` : ''}`;
  return `<span class="${cls}" title="${esc(tip)}">${before}≈${f}${assumed ? '<span class="unpriced" title="' + esc(UNPRICED_TIP) + '">?</span>' : ''}${after}</span>`;
}

function copyBtn(cmd) {
  return `<button class="copy" data-cmd="${esc(cmd)}" title="Copy resume command">⧉</button>`;
}

// Live sessions are already open somewhere; only offer open on idle ones.
let liveIds = new Set();
let jobBySession = new Map(); // background jobs (Agent View), by session id
const BG_TIP = 'Background session (claude --bg or Agent View)';
function renameBtn(sessionId, title) {
  return `<button class="copy rename-btn" data-rename-session="${esc(sessionId)}" data-title="${esc(title || '')}" title="Rename this session">✎</button>`;
}

function noteMark(sess) {
  return sess.note ? `<span class="note-mark" title="${esc(sess.note)}">≡</span>` : '';
}

function openBtn(sessionId) {
  if (liveIds.has(sessionId)) return '';
  return `<button class="copy open-btn" data-open="${esc(sessionId)}" title="Open this session">open</button>`;
}

// "Δ n" — how many files Claude edited in this session. Opens the changes panel.
function changesChip(sess) {
  if (!sess.changeCount) return '';
  return `<span class="badge changes" data-changes="${esc(sess.sessionId)}" title="${sess.changeCount} file${sess.changeCount === 1 ? '' : 's'} edited — click to see the diffs">Δ ${sess.changeCount}</span>`;
}

function gitBadges(git, missing) {
  const out = [];
  if (missing) out.push('<span class="badge missing">path missing</span>');
  if (!git || !git.isRepo) return out.join('');
  if (git.branch) out.push(`<span class="badge">${esc(git.branch)}</span>`);
  const changes = (git.dirty || 0) + (git.untracked || 0);
  if (changes) out.push(`<span class="badge dirty">●${changes}</span>`);
  if (git.ahead) out.push(`<span class="badge ahead">↑${git.ahead}</span>`);
  if (git.behind) out.push(`<span class="badge">↓${git.behind}</span>`);
  if (git.error) out.push(`<span class="badge err" title="${esc(git.error)}">git !</span>`);
  return out.join('');
}

// 412000 -> "412k", 1000000 -> "1M", 1500000 -> "1.5M".
function fmtCtx(n) {
  if (n >= 1e6) return `${+(n / 1e6).toFixed(1)}M`;
  return `${Math.round(n / 1000)}k`;
}

// How full the context window was on the last turn: amber from 70%, red from 90%.
function contextMeter(ctx) {
  if (!ctx) return '';
  const level = ctx.pct >= 90 ? 'bad' : ctx.pct >= 70 ? 'warn' : '';
  const tip = 'How much of the context window the last turn used. Claude Code compacts automatically as this fills; a fresh session is cheaper per turn when it is high.';
  return `<span class="ctx ${level}" title="${esc(`${ctx.pct}% — ${tip}`)}">
    <span class="ctx-label">${esc(fmtCtx(ctx.tokens))} / ${esc(fmtCtx(ctx.window))}</span>
    <span class="ctx-bar"><span class="ctx-fill" style="width:${Math.max(0, Math.min(100, Number(ctx.pct) || 0))}%"></span></span>
  </span>`;
}

function liveCard(s) {
  const task = s.currentTask
    ? `<div class="dep-task mono"><span class="prompt-ch">❯</span>${esc(s.currentTask.activeForm)}${
        s.tasksSummary ? `<span class="count">${s.tasksSummary.completed}/${
          s.tasksSummary.completed + s.tasksSummary.inProgress + s.tasksSummary.pending}</span>` : ''}</div>`
    : '';
  const dep = s.startedAt
    ? new Date(s.startedAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false })
    : '';
  const rl = s.status === 'waiting' ? reasonLine(s.waitingReason) : null;
  const reason = rl
    ? `<div class="dep-reason" title="${esc(rl.full)}">${rl.glyph ? `<span class="glyph">${rl.glyph}</span>` : ''}${esc(rl.short)}</div>`
    : '';
  // Agent View's one-line summary of a background session, when nothing more specific shows.
  const bgDetail = s.background && s.background.detail && !rl && !task
    ? `<div class="dep-task mono" title="Agent View's summary"><span class="prompt-ch">↳</span>${esc(s.background.detail)}</div>`
    : '';
  const kindBadge = s.background
    ? ` <span class="badge bg" title="${BG_TIP}">BG</span>`
    : s.isWorktree ? ' <span class="badge">worktree</span>' : '';
  return `<div class="dep-row ${s.status === 'waiting' ? 'waiting' : ''}">
    <span class="dep-proj" title="Started at ${esc(dep)}">${esc(s.projectName)}${kindBadge}</span>
    <div class="dep-mid">
      <div class="dep-title" data-session="${esc(s.sessionId)}" title="${esc(titleTip(s.model, 'Click to watch the transcript live'))}">${esc(s.title || '')}</div>
      ${task}
      ${reason}
      ${bgDetail}
    </div>
    <div class="dep-right">
      ${s.estCost != null ? `<span class="dep-cost">${costChip(s.estCost, { cls: 'dep-cost-main', assumed: s.assumed })}${
        s.burnRate ? `<span class="dep-burn" title="Spend per hour over the last 30 minutes">$${s.burnRate}/h</span>` : ''}</span>` : ''}
      ${contextMeter(s.context)}
      ${s.waitingMin != null
        ? `<span class="dep-elapsed overdue" title="No reply for ${s.waitingMin} minutes — session started ${elapsed(s.startedAt)} ago">${waitLabel(s.waitingMin)}</span>`
        : `<span class="dep-elapsed">${elapsed(s.startedAt)}</span>`}
      ${statusFlap(s)}
      <span class="acts">${renameBtn(s.sessionId, s.title)}${copyBtn(s.resumeCommand)}</span>
    </div>
  </div>`;
}

// "3 automated runs, 1 empty session" — the rows a card or drawer folds away.
function hiddenLabel(h) {
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  return [h.automated && plural(h.automated, 'automated run'), h.empty && plural(h.empty, 'empty session')]
    .filter(Boolean).join(', ');
}

function projectCard(p) {
  const sessions = p.sessions.length
    ? `<ul class="sessions">${p.sessions.map((sess) => `
        <li>
          <span class="s-title" data-session="${esc(sess.sessionId)}" title="${esc(titleTip(sess.model))}">${
            sess.worktree ? `<span class="wt mono">⎇ ${esc(sess.worktree)}</span>` : ''}${esc(sess.title)}</span>${noteMark(sess)}
          ${changesChip(sess)}
          <span class="s-when">${relTime(sess.lastActivityAt)}</span>
          <span class="acts">${renameBtn(sess.sessionId, sess.title)}${openBtn(sess.sessionId)}${copyBtn(sess.resumeCommand)}</span>
        </li>`).join('')}</ul>`
    : '';
  const hiddenTxt = p.hidden ? hiddenLabel(p.hidden) : '';
  const hiddenNote = hiddenTxt
    ? `<button class="hidden-note" data-detail="${esc(p.path)}" data-detail-name="${esc(p.name)}" title="One-shot claude -p runs and sessions closed without a prompt. Open the project to see them.">${esc(hiddenTxt)} hidden</button>`
    : '';
  const empty = !p.sessions.length && !hiddenTxt ? '<div class="none-yet">No sessions recorded.</div>' : '';
  return `<div class="card">
    <div class="head">
      ${p.isLive ? '<span class="live-dot" title="session running"></span>' : ''}
      <span class="name" data-detail="${esc(p.path)}" style="cursor:pointer" title="Click for project details">${esc(p.name)}</span>
      <button class="copy new-btn" data-new="${esc(p.path)}" title="Start a new Claude session here" aria-label="New session in ${esc(p.name)}">+</button>
      ${sparkSVG(p.activity.counts)}
    </div>
    <div class="meta">
      ${gitBadges(p.git, p.missing)}
      ${costChip(p.spend7d, { cls: 'badge', after: ' in 7d' })}
      <span class="when" title="${esc(p.path)}">${relTime(p.lastActivityAt)}</span>
    </div>
    ${sessions}${empty}${hiddenNote}
  </div>`;
}

function renderPinned(state) {
  const el = $('#pinned');
  const pins = state.pinned || [];
  el.hidden = !pins.length;
  if (!pins.length) { patch(el, ''); return; }
  patch(el, `<div class="sec-head">Pinned <span class="n">${pins.length}</span></div>` + pins.map((p) => `
    <div class="pin-row">
      <span class="star">★</span>
      <span class="s-title" data-session="${esc(p.sessionId)}" title="${esc(titleTip(p.model))}">${esc(p.title)}</span>${noteMark(p)}
      ${changesChip(p)}
      <span class="s-when">${esc(p.projectName)}</span>
      <span class="s-when">${relTime(p.lastActivityAt)}</span>
      <span class="acts">${renameBtn(p.sessionId, p.title)}<button class="copy" data-pin="${esc(p.sessionId)}" title="Unpin">unpin</button></span>
    </div>`).join(''));
}

const DORMANT_MS = 60 * 24 * 60 * 60 * 1000;

// ---------- git attention strip: repos with work sitting unpushed ----------
function renderGitAttention(state) {
  const el = $('#git-attn');
  const items = [];
  for (const p of state.projects || []) {
    const g = p.git;
    if (!g || !g.isRepo) continue;
    const changes = (g.dirty || 0) + (g.untracked || 0);
    const ahead = g.ahead || 0;
    if (!changes && !ahead) continue;
    items.push({ name: p.name, changes, ahead, when: p.lastActivityAt });
  }
  // Background jobs' worktrees: Agent View deletes the worktree with the session.
  const atRisk = (state.jobs || []).filter((j) => j.atRisk).map((j) => ({ ...j.atRisk, projectName: j.projectName, when: j.updatedAt }));
  if (!items.length && !atRisk.length) {
    el.hidden = true;
    return;
  }
  items.sort((a, b) => (b.when || 0) - (a.when || 0));
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  el.hidden = false;
  patch(el,
    `<span class="ga-label">Unpushed work in ${[items.length && plural(items.length, 'repo'), atRisk.length && plural(atRisk.length, 'worktree')].filter(Boolean).join(', ')}</span>` +
    items.map((it) => `<span class="ga-item">${esc(it.name)}${
      it.changes ? `<span class="badge dirty" title="${it.changes} uncommitted/untracked files">●${it.changes}</span>` : ''}${
      it.ahead ? `<span class="badge ahead" title="${it.ahead} commits not pushed">↑${it.ahead}</span>` : ''}</span>`).join('') +
    atRisk.map((w) => {
      const parts = [w.onlyHere && `${plural(w.onlyHere, 'commit')} on ${w.branch || 'this branch'} and no other branch`, w.changes && plural(w.changes, 'uncommitted file')].filter(Boolean);
      const tip = `Background job "${w.name}": ${parts.join(', ')}. Deleting the session from Agent View's list (ctrl+x twice) discards this; claude rm refuses until it is committed and pushed. Merge or push first.`;
      return `<span class="ga-item" title="${esc(tip)}">${esc(w.projectName || '')} <span class="wt mono">⎇ ${esc(w.worktree)}</span><span class="badge bg" title="${BG_TIP}">BG</span>${
        w.changes ? `<span class="badge dirty">●${w.changes}</span>` : ''}${
        w.onlyHere ? `<span class="badge dirty">⑂${w.onlyHere}</span>` : ''}</span>`;
    }).join(''));
}

// ---------- digest: what happened recently, across every project ----------
let digestDays = Number(localStorage.getItem('digestDays')) || 1;

function dayLabel(ms) {
  const d = new Date(ms), today = new Date();
  today.setHours(0, 0, 0, 0);
  const dayStart = new Date(d); dayStart.setHours(0, 0, 0, 0);
  const diff = Math.round((today - dayStart) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

function digestEntries(state) {
  const cutoff = Date.now() - digestDays * 86400000;
  const items = [];
  for (const p of state.projects || []) {
    for (const sess of p.sessions) {
      if (!sess.lastActivityAt || sess.lastActivityAt < cutoff) continue;
      items.push({ project: p.name, ...sess });
    }
  }
  items.sort((a, b) => b.lastActivityAt - a.lastActivityAt);
  return items;
}

function digestItem(it) {
  const t = it.tasksSummary;
  const total = t ? t.completed + t.inProgress + t.pending : 0;
  const running = liveIds.has(it.sessionId);
  const job = jobBySession.get(it.sessionId);
  const summary = it.awaySummary || (job && job.detail);
  const time = new Date(it.lastActivityAt).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  return `<div class="digest-item">
    <div class="di-top">
      <span class="di-proj">${esc(it.project)}</span>
      <span class="di-title" data-session="${esc(it.sessionId)}" title="${esc(titleTip(it.model))}">${it.worktree ? `<span class="wt mono">⎇</span> ` : ''}${esc(it.title)}</span>${noteMark(it)}
      ${job ? `<span class="badge bg" title="${BG_TIP}">BG</span>` : ''}
      ${running ? '<span class="flap disp st st-busy">running</span>' : ''}
      ${changesChip(it)}
      ${costChip(it.estCost, { cls: 'di-when', assumed: it.assumed })}
      <span class="di-when">${time}</span>
      <span class="acts">${openBtn(it.sessionId)}</span>
    </div>
    ${summary ? `<div class="di-summary" title="Click to expand">${esc(summary)}</div>` : ''}
    ${total ? `<div class="di-tasks"><span class="done">${t.completed}</span>/${total} tasks done${
      t.inProgress ? `, ${t.inProgress} in progress` : ''}${
      t.pending ? `, ${t.pending} left` : ''}</div>` : ''}
  </div>`;
}

function renderDigest(state) {
  const items = digestEntries(state);
  const label = $('#digest-label');
  label.textContent = 'Recent sessions';
  $('#digest-n').textContent = items.length || '';
  for (const b of document.querySelectorAll('#digest-range button')) {
    b.classList.toggle('sel', Number(b.dataset.days) === digestDays);
  }
  if (!items.length) {
    patch($('#digest-body'), `<div class="digest-empty">No sessions in the last ${
      digestDays === 1 ? 'day' : digestDays + ' days'}.</div>`);
    return;
  }
  let html = '', lastDay = '';
  for (const it of items) {
    const day = dayLabel(it.lastActivityAt);
    if (day !== lastDay) { html += `<div class="digest-day">${esc(day)}</div>`; lastDay = day; }
    html += digestItem(it);
  }
  patch($('#digest-body'), html);
}

let renderDeferred = false; // an SSE tick arrived while a rename input was open
function render(state) {
  // Rebuilding the DOM mid-edit would wipe the rename input; catch up afterwards.
  if (document.querySelector('.rename-input')) { renderDeferred = true; return; }
  renderDeferred = false;
  if (state.theme && state.theme !== 'board') document.documentElement.dataset.theme = state.theme;
  else delete document.documentElement.dataset.theme;
  liveIds = new Set((state.liveSessions || []).map((s) => s.sessionId));
  jobBySession = new Map((state.jobs || []).map((j) => [j.sessionId, j]));
  // A transcript being followed live keeps its header cost in step with the board.
  if (follow.id && exportableSession?.id === follow.id && exportableSession.usage) {
    const live = (state.liveSessions || []).find((s) => s.sessionId === follow.id);
    if (live && live.estCost != null && live.estCost !== exportableSession.usage.cost) {
      exportableSession.usage.cost = live.estCost;
      transcriptStatus();
    }
  }
  // quota
  const q = state.quota;
  const qEl = $('#quota');
  const spend = (state.projects || []).reduce((s, p) => s + (p.spend7d || 0), 0);
  const plan = state.plan;
  const planChip = plan && plan.label
    ? `<span class="badge" style="color:var(--accent)" title="${esc([
        plan.organization, plan.tier && `rate-limit tier: ${plan.tier}`,
        plan.extraUsage ? 'extra usage enabled' : null,
      ].filter(Boolean).join(' · '))}">${esc(plan.label)}</span>`
    : '';
  const b = state.budget;
  const budgetMeter = b
    ? meter('Budget', (b.spent / b.limit) * 100, `≈$${b.spent.toFixed(0)} of your $${b.limit} weekly budget (7-day estimate)`)
    : '';
  const spendChip = planChip + (fmtCost(spend)
    ? `<span class="q-spend">${weeklyChart(state.weeklyCost)}${costChip(spend, { cls: 'num' })}<span>in 7 days</span></span>`
    : '') + budgetMeter;
  if (q) {
    qEl.className = q.stale ? 'stale' : '';
    patch(qEl, spendChip +
      (q.utilization != null ? forecastMeter('Session', q.utilization, q.resetsAt, state.forecast && state.forecast.session) : '') +
      (q.weeklyUtilization != null ? forecastMeter('Week', q.weeklyUtilization, q.weeklyResetsAt, state.forecast && state.forecast.week) : '') +
      (q.costUsed != null && q.costLimit ? `<span title="Extra usage spent this month, of your limit">Extra <span class="num" style="color:var(--ink)">$${q.costUsed.toFixed(0)}</span> of $${q.costLimit.toFixed(0)}</span>` : ''));
  } else {
    qEl.className = '';
    patch(qEl, spendChip);
  }

  // live rail
  const live = state.liveSessions || [];
  patch($('#live'),
    `<div class="sec-head">Running now${live.length ? ` <span class="n">${live.length}</span>` : ''}</div>` +
    (live.length
      ? `<div class="rows">${live.map(liveCard).join('')}</div>`
      : `<div class="live-none">No sessions running. Start one with <code class="mono">claude</code> in any project.</div>`));

  renderGitAttention(state);
  renderPinned(state);
  if (typeof renderBell === 'function') renderBell(state);
  if (typeof mcSync === 'function') mcSync();
  if (typeof hiveSync === 'function') hiveSync();
  renderDigest(state);

  // grid + dormant
  const now = Date.now();
  const active = [], dormant = [];
  for (const p of state.projects || []) {
    const noiseOnly = !p.sessions.length && p.hidden && (p.hidden.automated || p.hidden.empty);
    const isDormant = !p.isLive && (noiseOnly || !p.lastActivityAt || now - p.lastActivityAt > DORMANT_MS);
    (isDormant ? dormant : active).push(p);
  }
  patch($('#grid'), active.length || dormant.length
    ? active.map(projectCard).join('')
    : `<div id="welcome">
        <h2><span class="tilde">❯</span> Welcome to Claude Mission Control</h2>
        <p>No Claude Code projects found yet. Run <code>claude</code> in any folder and it appears here automatically — live status, transcripts, git state, costs, the lot.</p>
        <p>Tip: press <code>⌘K</code> to jump anywhere, <code>/</code> to search, and <code>?</code> for a quick guide.</p>
      </div>`);
  const d = $('#dormant');
  d.hidden = dormant.length === 0;
  patch($('summary', d), `<span class="sec-head"><span class="caret">▶</span>Dormant projects <span class="n">${dormant.length}</span></span>`);
  const gh = $('#grid-head');
  gh.hidden = !active.length;
  $('.n', gh).textContent = active.length;
  patch($('.cards', d), dormant.map(projectCard).join(''));

  // tab title = attention signal
  // collection errors get a subtle amber gear, details live in settings
  $('#gear').style.color = (state.errors || []).length ? 'var(--warn)' : '';
  $('#gear').title = (state.errors || []).length
    ? `${state.errors.length} collection errors — see Diagnostics in settings`
    : 'Settings';

  const waiting = live.filter((s) => s.status === 'waiting').length;
  document.title = waiting ? `(${waiting} waiting) Claude Mission Control`
    : live.length ? `(${live.length} running) Claude Mission Control`
    : 'Claude Mission Control';
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// Where "open" launches sessions: the configured terminal (label reflects
// what will actually launch) or the Claude desktop app when installed.
const prefEl = $('#open-pref');
prefEl.addEventListener('change', () => localStorage.setItem('openTarget', prefEl.value));

async function loadOpenPref() {
  try {
    const c = await (await fetch('/api/config')).json();
    const opts = [`<option value="terminal">${esc(c.resolvedTerminal.label)}</option>`];
    if (c.claudeApp) opts.push('<option value="app">Claude app</option>');
    prefEl.innerHTML = opts.join('');
    $('#open-pref-wrap').hidden = opts.length < 2;
    const stored = localStorage.getItem('openTarget') || 'terminal';
    prefEl.value = stored === 'app' && !c.claudeApp ? 'terminal' : stored;
  } catch {
    prefEl.value = 'terminal';
  }
}
loadOpenPref();

// digest window buttons + expandable summaries + collapsed-state memory
document.addEventListener('click', (e) => {
  const rangeBtn = e.target.closest('#digest-range button');
  if (rangeBtn) {
    e.preventDefault(); // don't toggle the <details>
    digestDays = Number(rangeBtn.dataset.days);
    localStorage.setItem('digestDays', String(digestDays));
    if (lastState) renderDigest(lastState);
    return;
  }
  const sum = e.target.closest('.di-summary');
  if (sum) sum.classList.toggle('expanded');
});
const digestEl = $('#digest');
digestEl.open = localStorage.getItem('digestOpen') !== '0';
digestEl.addEventListener('toggle', () => localStorage.setItem('digestOpen', digestEl.open ? '1' : '0'));

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copy');
  if (!btn) return;
  if (btn.dataset.open) {
    const target = prefEl.value;
    btn.disabled = true;
    try {
      const r = await fetch('/api/open', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: btn.dataset.open, target }),
      });
      const out = await r.json();
      toast(out.ok
        ? `Opening in ${target === 'app' ? 'Claude app' : 'Ghostty'}…`
        : `Couldn't open: ${out.error}`);
    } catch {
      toast("Couldn't reach the server");
    }
    btn.disabled = false;
    return;
  }
  if (btn.dataset.recipe !== undefined) {
    try {
      await navigator.clipboard.writeText(btn.dataset.recipe);
      toast(`Copied — merge into ${btn.dataset.recipeTarget}`);
    } catch {
      toast('Clipboard blocked by the browser');
    }
    return;
  }
  if (btn.dataset.reveal) {
    try {
      const r = await fetch('/api/reveal-file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: btn.dataset.revealPath, which: btn.dataset.reveal }),
      });
      const out = await r.json();
      toast(out.ok ? 'Revealed in the file manager' : `Couldn't reveal: ${out.error}`);
    } catch {
      toast("Couldn't reach the server");
    }
    return;
  }
  if (btn.dataset.cmd === undefined) return; // other .copy buttons have their own handlers
  navigator.clipboard.writeText(btn.dataset.cmd).then(() => toast('Resume command copied'));
});

// ---------- data flow: first paint from /api/state, then SSE, 60s poll fallback ----------
let lastState = null;

async function poll() {
  try {
    const r = await fetch('/api/state');
    lastState = await r.json();
    render(lastState);
  } catch { /* server briefly down; SSE retry will recover */ }
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('state', (e) => {
    $('#conn').className = 'on';
    lastState = JSON.parse(e.data);
    render(lastState);
  });
  es.onopen = () => { $('#conn').className = 'on'; };
  es.onerror = () => { $('#conn').className = 'retry'; };
}

// ---------- project detail drawer ----------
// Minimal markdown renderer: escape everything first, then transform.
// Covers headings, fenced code, inline code, bold/italic, links, lists,
// blockquotes, and hr — enough for CLAUDE.md and memory files.
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMd(raw) {
  // Frontmatter is metadata, not prose — drop it before rendering.
  raw = raw.replace(/^---\n[\s\S]*?\n---\n/, '');
  const lines = esc(raw).split('\n');
  const out = [];
  let list = null, para = [], code = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${mdInline(para.join(' '))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.join('')}</${list.tag}>`); list = null; } };
  for (const line of lines) {
    if (code !== null) {
      if (/^```/.test(line)) { out.push(`<pre><code>${code.join('\n')}</code></pre>`); code = null; }
      else code.push(line);
      continue;
    }
    if (/^```/.test(line)) { flushPara(); flushList(); code = []; continue; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); continue; }
    const li = line.match(/^\s*(?:[-*+]|(\d+)\.)\s+(.*)/);
    if (li) {
      flushPara();
      const tag = li[1] ? 'ol' : 'ul';
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(`<li>${mdInline(li[2])}</li>`);
      continue;
    }
    if (/^\s*&gt;\s?/.test(line)) { flushPara(); flushList(); out.push(`<blockquote>${mdInline(line.replace(/^\s*&gt;\s?/, ''))}</blockquote>`); continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    para.push(line.trim());
  }
  flushPara(); flushList();
  if (code !== null) out.push(`<pre><code>${code.join('\n')}</code></pre>`);
  return `<div class="md">${out.join('')}</div>`;
}

// "≈$3.40 per commit · 18 of 30 made during a Claude session · ≈$12 in sessions with no commit"
function commitSummaryLine(s) {
  if (!s || !s.withSession) return '';
  const w = costWording();
  const parts = [
    `${costChip(s.perCommit, { cls: '' })} per commit`,
    `${s.withSession} of ${s.total} made during a Claude session`,
    fmtCost(s.noCommitSpend) ? `${costChip(s.noCommitSpend, { cls: '' })} in sessions with no commit` : '',
  ].filter(Boolean);
  return `<div class="set-sub" style="margin:0 0 8px" title="${esc(`Each session's ${w.noun} is split evenly over the commits made while it was active (±5 minutes). Commits outside any session are left out.`)}">${parts.join(' · ')}</div>`;
}

function dSection(title, inner, empty) {
  return `<details class="d-section" open><summary>${esc(title)}</summary>${
    inner || `<div class="d-empty">${esc(empty)}</div>`}</details>`;
}

function dFiles(files, nameKey) {
  return files.map((f) => `<div class="d-file">
    <div class="d-file-name">${esc(f[nameKey] || f.name)}${f.description ? ` — <span style="color:var(--muted)">${esc(f.description)}</span>` : ''}</div>
    ${f.content ? renderMd(f.content) : ''}
  </div>`).join('');
}

// One row per plugin/agent/skill/server with state, source, the scope that
// decided it, and a copy button for the recipe that flips it.
function toolsetRow(r) {
  const state = r.enabled ? (r.mode && r.mode !== 'on' ? r.mode : 'on') : 'off';
  const decided = r.decidedBy === 'default' ? '' : ` · by ${r.decidedBy}`;
  const src = r.source === 'plugin' ? `plugin:${esc(String(r.pluginId || '').split('@')[0])}` : esc(r.source);
  return `<tr>
    <td><span title="${esc(r.description || '')}">${esc(r.name)}</span>${
      r.installed === false ? ' <span class="badge" title="enabled in settings but not installed">not installed</span>' : ''}${
      r.stale ? ' <span class="badge" title="marketplace refreshed after this plugin was last updated">stale</span>' : ''}${
      r.needsAuth ? ' <span class="badge" style="color:var(--warn)">needs auth</span>' : ''}${
      r.shadowed && r.shadowed.length ? ` <span class="ts-shadow" title="${esc('lower-precedence copies: ' + r.shadowed.join(', '))}">shadows ${r.shadowed.length}</span>` : ''}</td>
    <td><span class="ts-state ${r.enabled ? 'on' : 'off'}">${esc(state)}</span><span class="ts-src">${src}${esc(decided)}</span></td>
    <td>${r.recipe ? `<button class="copy" data-recipe="${esc(r.recipe.text)}" data-recipe-target="${esc(r.recipe.target)}" title="${esc(`Copy: ${r.recipe.label}`)}">⧉</button>` : ''}</td>
  </tr>`;
}

function toolsetHtml(t, projectPath) {
  if (!t) return null;
  const audit = (t.audit || []).length
    ? `<ul class="ts-audit">${t.audit.map((a) => `<li class="${a.level === 'info' ? 'info' : ''}">${esc(a.text)}</li>`).join('')}</ul>` : '';
  const table = (label, rows, empty) => {
    const off = rows.filter((r) => !r.enabled);
    const ordered = [...off, ...rows.filter((r) => r.enabled)];
    return `<details class="ts-kind"${rows.length < 8 ? ' open' : ''}><summary>${esc(label)} — ${rows.length}${off.length ? ` · ${off.length} off` : ''}</summary>${
      rows.length ? `<table class="stat-table ts-table">${ordered.map(toolsetRow).join('')}</table>` : `<div class="d-empty">${esc(empty)}</div>`}</details>`;
  };
  const fileBtn = (which, label) => t.files && t.files[which]
    ? `<button class="copy" data-reveal="${which}" data-reveal-path="${esc(projectPath)}" title="Reveal in the file manager">open ${esc(label)}</button>`
    : `<button class="copy" data-recipe="{}" data-recipe-target="${esc(label)}" title="This file does not exist yet — copies an empty object to start it">create ${esc(label)}</button>`;
  return audit +
    table('Plugins', t.plugins || [], 'No plugins installed.') +
    table('Agents', t.agents || [], 'No agents from the project, your user dir, or enabled plugins.') +
    table('Skills', t.skills || [], 'No skills from the project, your user dir, or enabled plugins.') +
    table('MCP servers', t.mcp || [], 'No MCP servers apply to this project.') +
    `<div class="ts-foot">${fileBtn('local', '.claude/settings.local.json')}${fileBtn('project', '.claude/settings.json')}${
      t.files && t.files.mcpJson ? fileBtn('mcpJson', '.mcp.json') : ''}</div>`;
}

function renderDetail(d, name) {
  $('#d-title').textContent = name;
  $('#d-path').textContent = d.path;
  const sessionRow = (s) => `
        <li>
          <span class="s-title" data-session="${esc(s.sessionId)}" title="${esc(titleTip(s.model))}">${
            s.worktree ? `<span class="wt mono">⎇ ${esc(s.worktree)}</span> ` : ''}${esc(s.title)}</span>${noteMark(s)}
          ${changesChip(s)}
          ${costChip(s.estCost, { assumed: s.assumed })}
          <span class="s-when">${relTime(s.lastActivityAt)}</span>
          <span class="acts">${renameBtn(s.sessionId, s.title)}${openBtn(s.sessionId)}${copyBtn(s.resumeCommand)}</span>
        </li>`;
  const real = d.sessions.filter((s) => !s.kind);
  const noise = d.sessions.filter((s) => s.kind);
  const noiseTxt = hiddenLabel({
    automated: noise.filter((s) => s.kind === 'automated').length,
    empty: noise.filter((s) => s.kind === 'empty').length,
  });
  const sessions = d.sessions.length
    ? (real.length ? `<ul class="d-sessions">${real.map(sessionRow).join('')}</ul>` : '') +
      (noise.length ? `<details class="d-noise"><summary>${esc(noiseTxt)}</summary><ul class="d-sessions">${noise.map(sessionRow).join('')}</ul></details>` : '')
    : null;
  const caps = [...d.skills, ...d.agents.map((a) => ({ ...a, name: `agent: ${a.name}` })),
    ...d.commands.map((c) => ({ ...c, name: `/${c.name}` }))];
  const settingsEntries = [];
  if (d.settings.mcpServers) settingsEntries.push(`<div class="d-file"><div class="d-file-name">MCP servers</div><div class="md"><p>${d.settings.mcpServers.map(esc).join(', ')}</p></div></div>`);
  if (d.settings.allowedTools) settingsEntries.push(`<div class="d-file"><div class="d-file-name">allowed tools</div><div class="md"><p>${d.settings.allowedTools.map((t) => `<code>${esc(t)}</code>`).join(' ')}</p></div></div>`);
  for (const [key, label] of [['settings', '.claude/settings.json'], ['settingsLocal', '.claude/settings.local.json'], ['mcpJson', '.mcp.json']]) {
    if (d.settings[key]) settingsEntries.push(`<div class="d-file"><div class="d-file-name">${label}</div><div class="md"><pre><code>${esc(d.settings[key])}</code></pre></div></div>`);
  }
  const muteBtn = `<div style="margin-bottom:10px"><button class="copy" data-mute="${esc(d.path)}" data-muted="${d.muted ? '1' : ''}" title="Per-project desktop notifications">${
    d.muted ? '🔕 muted — click to unmute' : '🔔 notifying — click to mute'}</button></div>`;
  const statCompact = (stat) => {
    const ins = /(\d+) insertion/.exec(stat || '');
    const del = /(\d+) deletion/.exec(stat || '');
    return [ins && `+${ins[1]}`, del && `−${del[1]}`].filter(Boolean).join(' ');
  };
  const commitRows = (d.commits || []).map((c) => `
    <li>
      <span class="s-title" title="${esc(c.stat || '')}">
        <code class="mono" style="color:var(--faint)">${esc(c.sha)}</code>
        ${c.claude ? '<span class="badge" title="Co-authored by Claude">✳ claude</span>' : ''}
        ${esc(c.subject)}
      </span>
      ${c.sessionId ? `<button class="copy" data-session="${esc(c.sessionId)}" title="${esc(c.sessionTitle || '')}">session →</button>` : ''}
      ${c.cost != null ? `<span title="${esc((c.costFrom || []).map((f) =>
        `${f.title || 'session'}: split over ${f.commits} commit${f.commits === 1 ? '' : 's'}`).join('\n'))}">${costChip(c.cost)}</span>` : ''}
      <span class="s-when">${esc(statCompact(c.stat))}</span>
      <span class="s-when">${relTime(c.ts)}</span>
    </li>`).join('');
  const tsFiles = { ...((d.toolset && d.toolset.files) || {}), mcpJson: !!(d.settings && d.settings.mcpJson) };
  const ts = d.toolset ? { ...d.toolset, files: tsFiles } : null;
  const KINDS = ['plugins', 'agents', 'skills', 'mcp'];
  const tsOn = ts ? KINDS.reduce((n, k) => n + (ts[k] || []).filter((r) => r.enabled).length, 0) : 0;
  const tsOff = ts ? KINDS.reduce((n, k) => n + (ts[k] || []).filter((r) => !r.enabled).length, 0) : 0;
  $('#d-body').innerHTML =
    muteBtn +
    dSection(`Sessions — ${d.sessions.filter((s) => !s.kind).length}`, sessions, 'No sessions recorded.') +
    dSection(`What changed — last ${(d.commits || []).length} commits`, commitRows ? commitSummaryLine(d.commitSummary) + `<ul class="d-sessions">${commitRows}</ul>` : null, 'No git history here.') +
    dSection('CLAUDE.md', d.claudeMd.length ? dFiles(d.claudeMd, 'name') : null, 'No CLAUDE.md — sessions here start without project instructions.') +
    dSection(`Memory — ${d.memory.length} file${d.memory.length === 1 ? '' : 's'}`, d.memory.length ? dFiles(d.memory, 'name') : null, 'No memory yet.') +
    dSection(`Skills, agents & commands — ${caps.length}`, caps.length ? dFiles(caps, 'name') : null, 'None in .claude/skills, .claude/agents, or .claude/commands.') +
    dSection(`Toolset — ${tsOn} on · ${tsOff} off`, toolsetHtml(ts, d.path), 'Toolset unavailable.') +
    dSection('Settings', settingsEntries.length ? settingsEntries.join('') : null, 'No project-level settings or MCP servers.');
}

async function openDetail(path, name) {
  const drawer = $('#drawer'), backdrop = $('#drawer-backdrop');

// ---------- transcript viewer, with live follow for running sessions ----------
const follow = { id: null, offset: 0, lastDay: '', eventCount: 0, projectName: '', timer: null };

function stopFollow() {
  clearInterval(follow.timer);
  follow.timer = null;
  follow.id = null;
}

function transcriptHtml(events, st = follow) {
  const parts = [];
  for (const ev of events) {
    if (ev.ts) {
      const day = new Date(ev.ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      if (day !== st.lastDay) { parts.push(`<div class="t-ts">${esc(day)}</div>`); st.lastDay = day; }
    }
    if (ev.kind === 'user') {
      parts.push(`<div class="t-turn t-user"><span class="t-who">you${
        ev.ts ? ' · ' + new Date(ev.ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : ''
      }</span>${esc(ev.text)}${ev.truncated ? ' …' : ''}</div>`);
    } else if (ev.kind === 'assistant') {
      parts.push(`<div class="t-turn">${renderMd(ev.text + (ev.truncated ? ' …' : ''))}</div>`);
    } else if (ev.kind === 'tool') {
      parts.push(`<div class="t-tool">⚙ <span class="t-tname">${esc(ev.name)}</span> ${esc(ev.input || '')}</div>`);
    } else if (ev.kind === 'note') {
      parts.push(`<div class="t-note">${esc(ev.text)}</div>`);
    }
  }
  return parts.join('');
}

let exportableSession = null;
function sessionChangeCount(sid) {
  if (exportableSession?.id === sid) return exportableSession.changeCount || 0;
  for (const p of lastState?.projects || []) for (const s of p.sessions) if (s.sessionId === sid) return s.changeCount || 0;
  for (const p of lastState?.pinned || []) if (p.sessionId === sid) return p.changeCount || 0;
  return 0;
}

function transcriptStatus() {
  const liveNow = follow.id && liveIds.has(follow.id);
  const sid = exportableSession && exportableSession.id;
  const isPinned = sid && (lastState?.pinned || []).some((p) => p.sessionId === sid);
  const n = sid ? sessionChangeCount(sid) : 0;
  $('#d-path').textContent = `${follow.projectName} · ${follow.eventCount} events${liveNow ? ' · ● live' : ''}`;
  $('#d-actions').innerHTML = `
    ${exportableSession?.usage ? `<button class="copy" data-usage-toggle title="${esc(`${costWording().noun} — ${costWording().tip}${exportableSession.usage.assumedModels?.length ? ' ' + UNPRICED_TIP : ''} Click for the breakdown by model.`)}">≈${fmtCost(exportableSession.usage.cost) || '$0.00'}${exportableSession.usage.assumedModels?.length ? ` <span class="unpriced" title="${esc(UNPRICED_TIP)}">?</span>` : ''} ▾</button>` : ''}
    ${n ? `<button class="copy" data-changes-toggle="${esc(sid)}" title="Files Claude edited in this session">changes Δ ${n}</button>` : ''}
    ${sid ? `<button class="copy" data-note-toggle title="Attach a note to this session">note${exportableSession.note ? ' ≡' : ''}</button>` : ''}
    <button class="copy" data-export title="Download this transcript as markdown">export ⇩</button>
    ${sid ? `<button class="copy" data-pin="${esc(sid)}" title="${isPinned ? 'Unpin this session' : 'Pin this session to the top of the dashboard'}">${isPinned ? '★ pinned' : '☆ pin'}</button>` : ''}
    ${!liveNow ? '<button class="copy" data-replay title="Play the conversation back turn by turn">replay ▸</button>' : ''}`;
}

function fmtTok(n) {
  return n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n || 0);
}

function usagePanelHtml(u) {
  const w = costWording();
  const rows = u.byModel.map((r) => `<tr>
    <td>${esc(modelShort(r.model))}${u.assumedModels?.includes(r.model) ? ' <span class="unpriced" title="' + esc(UNPRICED_TIP) + '">?</span>' : ''}</td>
    <td>${fmtTok(r.input)}</td><td>${fmtTok(r.output)}</td><td>${fmtTok(r.cacheRead)}</td><td>${fmtTok(r.cacheCreation)}</td>
    <td>≈$${r.cost.toFixed(2)}</td></tr>`).join('');
  const subs = u.subagents
    ? `<tr><td colspan="5">of which subagents (${u.subagents.count}, ${fmtTok(u.subagents.tokens)} tok)</td><td>≈$${u.subagents.cost.toFixed(2)}</td></tr>`
    : '';
  const foot = [
    u.cacheHitRatio != null ? `cache ${Math.round(u.cacheHitRatio * 100)}% of input served from cache` : null,
    u.context ? `context ${fmtCtx(u.context.tokens)} / ${fmtCtx(u.context.window)} (${u.context.pct}%)` : null,
    u.tools ? `${u.tools.total} tool calls${u.tools.errors ? `, ${u.tools.errors} failed` : ''}` : null,
    u.assumedModels?.length ? `unpriced: ${u.assumedModels.map(modelShort).join(', ')} (Opus-tier rate assumed)` : null,
  ].filter(Boolean).join(' · ');
  return `<div id="usage-panel">
    <table class="stat-table usage-table">
      <tr class="h"><td>model</td><td>in</td><td>out</td><td>cache read</td><td>cache write</td><td>${esc(w.noun)}</td></tr>
      ${rows}${subs}
    </table>
    <div class="usage-foot">${esc(foot)}<span class="set-sub">${esc(w.tip)}</span></div>
  </div>`;
}

function toggleUsagePanel() {
  const existing = $('#usage-panel');
  if (existing) { existing.remove(); return; }
  if (!exportableSession?.usage) return;
  $('#d-body').insertAdjacentHTML('afterbegin', usagePanelHtml(exportableSession.usage));
}

function openNoteEditor() {
  const existing = $('#note-editor');
  if (existing) { existing._finish(true); return; }   // toggle-close saves
  const ed = document.createElement('div');
  ed.id = 'note-editor';
  ed.innerHTML = `<textarea maxlength="2000" placeholder="A note for future you — what this session was for, what's left, what to remember.">${esc(exportableSession.note || '')}</textarea>
    <span class="hint">saves on blur or ⌘⏎ · Esc cancels · empty removes the note</span>`;
  $('#d-body').prepend(ed);
  const ta = ed.querySelector('textarea');
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const value = ta.value;
    ed.remove();
    if (save) saveNote(value);
  };
  ed._finish = finish;
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); finish(false); }
    else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); finish(true); }
  });
  ta.addEventListener('blur', () => finish(true));
  ta.focus();
}

function closeNoteEditor() {
  const ed = $('#note-editor');
  if (ed && ed._finish) ed._finish(false);
  else if (ed) ed.remove();
}

async function saveNote(text) {
  const sid = exportableSession && exportableSession.id;
  if (!sid) return;
  const before = exportableSession.note || '';
  if (text.trim() === before) return;
  try {
    const r = await fetch('/api/session-note', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: sid, note: text }) });
    const out = await r.json();
    if (!out.ok) throw new Error(out.error);
    exportableSession.note = out.note || null;
    transcriptStatus();
    toast(out.note ? 'Note saved' : 'Note removed');
  } catch {
    toast("Couldn't save the note");
    openNoteEditor();
    const ta = $('#note-editor textarea');
    if (ta) ta.value = text;
  }
}

// ---------- changes panel: files edited, net + per-edit diffs ----------
const chg = { sid: null, open: false };

function fmtWhen(ms) {
  return ms ? new Date(ms).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '';
}

function changeRow(f) {
  const counts = f.missingBackup ? '<span class="badge">backup gone</span>'
    : f.tooLarge ? '<span class="badge">too large to diff</span>'
    : `<span class="add">+${f.added}${f.truncated ? '+' : ''}</span> <span class="del">−${f.removed}${f.truncated ? '+' : ''}</span>`;
  return `<div class="chg-file" data-n="${f.n}">
    <div class="chg-head" data-chg-open="${f.n}">
      <span class="chg-path" title="${esc(f.path)}">${esc(f.rel)}</span>
      ${f.exists ? '' : '<span class="badge missing">deleted</span>'}
      ${counts}
      <span class="s-when">${f.versions.length} version${f.versions.length === 1 ? '' : 's'} · ${fmtWhen(f.last)}</span>
    </div>
    <div class="chg-body" hidden></div>
  </div>`;
}

function renderChangesPanel(data, error) {
  const body = $('#d-body');
  let panel = $('#changes-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'changes-panel';
    body.prepend(panel);
  }
  panel.innerHTML = error
    ? '<div class="chg-note">Couldn\'t load the changes for this session.</div>'
    : data.files.length
      ? `<div class="d-section" style="margin-top:0"><div class="d-section-title">Changes — ${data.files.length} file${data.files.length === 1 ? '' : 's'}</div>${data.files.map(changeRow).join('')}</div>`
      : '<div class="chg-note">No file edits recorded for this session.</div>';
  panel._files = data.files;
  body.scrollTop = 0;
}

function diffHtml(d) {
  if (d.missingBackup) return '<div class="chg-note">The backup for this version is gone.</div>';
  if (d.tooLarge) return '<div class="chg-note">Too large to diff (over 400 KB).</div>';
  if (!d.hunks.length) return '<div class="chg-note">No differences.</div>';
  const out = ['<pre class="diff">'];
  for (const h of d.hunks) {
    out.push(`<div class="hh">@@ -${h.aStart},${h.aLines} +${h.bStart},${h.bLines} @@</div>`);
    let a = h.aStart, b = h.bStart;
    for (const [op, text] of h.lines) {
      const cls = op === '+' ? 'add' : op === '-' ? 'del' : 'ctx';
      const la = op === '+' ? '' : a++, lb = op === '-' ? '' : b++;
      out.push(`<div class="dl ${cls}"><span class="ln">${la}</span><span class="ln">${lb}</span><span class="tx">${esc(op + ' ' + text)}</span></div>`);
    }
  }
  out.push('</pre>');
  if (d.truncated) out.push('<div class="chg-note">Diff truncated after 2,000 changed lines.</div>');
  return out.join('');
}

async function loadFileDiff(sid, n, from, to) {
  const file = $(`#changes-panel .chg-file[data-n="${n}"]`);
  if (!file) return;
  const body = file.querySelector('.chg-body');
  const f = ($('#changes-panel')._files || [])[n];
  const versions = f ? f.versions : [];
  const sel = (a, b) => (String(from) === String(a) && String(to) === String(b)) ? ' sel' : '';
  const pairs = [[versions[0], 'disk', 'net']].concat(versions.slice(0, -1).map((v, i) => [v, versions[i + 1], `v${v} → v${versions[i + 1]}`]));
  const buttons = pairs.length > 1
    ? `<div class="chg-versions">${pairs.map(([a, b, label]) => `<button class="copy${sel(a, b)}" data-chg-diff="${n}" data-from="${a}" data-to="${b}">${esc(label)}</button>`).join('')}</div>`
    : '';
  body.hidden = false;
  body.innerHTML = buttons + '<div class="chg-note">Loading…</div>';
  try {
    const r = await fetch(`/api/session-changes?id=${encodeURIComponent(sid)}&file=${n}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    if (!r.ok) throw new Error();
    body.innerHTML = buttons + diffHtml(await r.json());
  } catch {
    body.innerHTML = buttons + '<div class="chg-note">Couldn\'t load the diff.</div>';
  }
}

async function openChanges(sid) {
  chg.sid = sid;
  chg.open = true;
  try {
    const r = await fetch(`/api/session-changes?id=${encodeURIComponent(sid)}`);
    if (!r.ok) throw new Error();
    renderChangesPanel(await r.json());
  } catch {
    renderChangesPanel({ files: [] }, true);
  }
}

function closeChanges() {
  chg.open = false;
  const panel = $('#changes-panel');
  if (panel) panel.remove();
}

// ---------- session replay ----------
let replay = null;
function stopReplay(reveal = true) {
  if (!replay) return;
  clearInterval(replay.timer);
  if (reveal) for (const n of replay.nodes) n.style.display = '';
  replay = null;
  const b = document.querySelector('[data-replay]');
  if (b) b.textContent = 'replay ▸';
}
function startReplay() {
  const nodes = [...$('#d-body').children];
  if (!nodes.length) return;
  for (const n of nodes) n.style.display = 'none';
  $('#d-body').scrollTop = 0;
  let i = 0;
  replay = {
    nodes,
    timer: setInterval(() => {
      if (i >= nodes.length) { stopReplay(false); return; }
      nodes[i].style.display = '';
      nodes[i].scrollIntoView({ block: 'nearest' });
      i++;
    }, 280),
  };
  const b = document.querySelector('[data-replay]');
  if (b) b.textContent = 'stop ■';
}

async function pollFollow() {
  if (!follow.id) return;
  try {
    const r = await fetch(`/api/session?id=${encodeURIComponent(follow.id)}&after=${follow.offset}`);
    if (!r.ok) return;
    const t = await r.json();
    if (follow.id !== t.sessionId) return; // drawer moved on meanwhile
    follow.offset = t.nextOffset;
    if (t.events.length) {
      const body = $('#d-body');
      const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 200;
      follow.eventCount += t.events.length;
      body.insertAdjacentHTML('beforeend', transcriptHtml(t.events));
      if (nearBottom) body.scrollTop = body.scrollHeight;
    }
    transcriptStatus();
    if (!liveIds.has(follow.id) && !t.events.length) stopFollow(); // session ended and drained
  } catch { /* transient; next tick retries */ }
}

async function openTranscript(sessionId, highlight, opts = {}) {
  openDrawerShell('Transcript', sessionId);
  stopFollow();
  try {
    const r = await fetch(`/api/session?id=${encodeURIComponent(sessionId)}`);
    if (!r.ok) throw new Error();
    const t = await r.json();
    exportableSession = { id: sessionId, title: t.title, note: t.note || null };
    exportableSession.changeCount = t.changeCount || 0;
    exportableSession.usage = t.usage || null;
    follow.id = sessionId;
    follow.offset = t.nextOffset;
    follow.lastDay = '';
    follow.eventCount = t.events.length;
    follow.projectName = t.projectName;
    $('#d-title').textContent = t.title;
    const parts = [];
    if (t.truncatedTurns) parts.push(`<div class="d-empty">… ${t.truncatedTurns} earlier events not shown</div>`);
    if (t.agents) parts.unshift(agentTree(t.agents));
    parts.push(transcriptHtml(t.events));
    $('#d-body').innerHTML = parts.join('') || '<div class="d-empty">Empty transcript.</div>';
    transcriptStatus();
    if (opts.changes) await openChanges(sessionId);
    if (liveIds.has(sessionId)) {
      if (!opts.changes) $('#d-body').scrollTop = $('#d-body').scrollHeight; // start at the newest
      else $('#changes-panel')?.scrollIntoView({ block: 'start' });
      follow.timer = setInterval(pollFollow, 2500);
    } else {
      follow.id = null;
      if (highlight) {
        const needle = highlight.toLowerCase();
        const hit = [...$('#d-body').querySelectorAll('.t-turn')]
          .find((el) => el.textContent.toLowerCase().includes(needle));
        if (hit) {
          hit.scrollIntoView({ block: 'center' });
          hit.classList.add('hl-flash');
          setTimeout(() => hit.classList.remove('hl-flash'), 2400);
        }
      }
    }
  } catch {
    $('#d-body').innerHTML = '<div class="d-empty" style="padding:20px 0">Couldn\'t load the transcript.</div>';
  }
}

// ---------- mission control: every live session streaming side by side ----------
const mc = { open: false, panes: new Map(), timer: null, polling: false };

function openMissionControl() {
  if (mc.open) return;
  closeHive();
  mc.open = true;
  $('#mc').hidden = false;
  mcSync();
  mcPoll();
  mc.timer = setInterval(mcPoll, 2500);
}

function closeMissionControl() {
  if (!mc.open) return;
  mc.open = false;
  $('#mc').hidden = true;
  clearInterval(mc.timer);
  mc.timer = null;
  mc.panes.clear();
  $('#mc-grid').innerHTML = '';
}

function mcPaneHead(s) {
  const subs = s.subagents
    ? `<span class="mc-meta" title="subagent transcripts · their tokens">⑂ ${s.subagents.count}${
        s.subagents.mtok ? ` · ${s.subagents.mtok}M tok` : ''}</span>`
    : '';
  // Two rows: identity and status on top, the numbers underneath, so a
  // narrow pane never pushes its status badge into the next one.
  const stats = `${s.estCost != null ? costChip(s.estCost, { cls: 'mc-meta', assumed: s.assumed, after: s.burnRate ? ` · $${s.burnRate}/h` : '' }) : ''}${contextMeter(s.context)}${s.tools ? `<span class="mc-meta" title="tool calls in this session">${s.tools.total} tools${s.tools.errors ? ` · <span class="failed">${s.tools.errors} failed</span>` : ''}</span>` : ''}${subs}`;
  return `<span class="mc-proj" data-session="${esc(s.sessionId)}" title="Open the full transcript">${esc(s.projectName)}</span>
    ${modelChip(s.model)}<span class="spacer"></span>
    <span class="mc-meta${s.waitingMin != null ? ' overdue' : ''}">${s.waitingMin != null ? waitLabel(s.waitingMin) : elapsed(s.startedAt)}</span>${statusFlap(s, 'mc:')}${
    stats ? `<span class="mc-stats">${stats}</span>` : ''}`;
}

const AGENT_COLORS = { blue: '#4a90e2', green: 'var(--accent)', red: 'var(--bad)', yellow: 'var(--warn)', purple: '#a86ee0', cyan: '#2fb8c9', orange: '#e08a2f', pink: '#e06ea8', gray: 'var(--faint)', grey: 'var(--faint)' };

function agentTree(agents, { collapsible = false, key = '' } = {}) {
  if (!agents || !agents.list || !agents.list.length) return '';
  const colorFor = (c) => {
    const ck = (c || '').toLowerCase();
    return Object.hasOwn(AGENT_COLORS, ck) ? AGENT_COLORS[ck] : 'var(--muted)';
  };
  const rows = agents.list.map((a) => `<div class="agent">
      <span class="swatch" style="background:${colorFor(a.color)}"></span>
      <span class="aname">${esc(a.name)}</span>
      ${a.type && a.type !== a.name ? `<span class="atype">${esc(a.type)}</span>` : ''}
      ${a.model ? modelChip(a.model) : ''}
      <span class="astatus ${a.status}" title="${a.status === 'active' ? 'wrote to its transcript in the last 2 minutes' : 'quiet for two minutes or more (may still be alive)'}">${a.status === 'active' ? '●' : '○'}</span>
    </div>`).join('');
  const team = agents.team ? `<div class="team">team · ${esc(agents.team)}</div>` : '';
  if (!collapsible) return `<div class="agents">${team}${rows}</div>`;
  const stored = localStorage.getItem(`agentsOpen:${key}`);
  const open = stored === '1' || (stored !== '0' && agents.list.length <= 8);
  return `<details class="agents" data-agents-key="${esc(key)}" ${open ? 'open' : ''}><summary>${agents.list.length} agent${agents.list.length === 1 ? '' : 's'}${agents.team ? ` · ${esc(agents.team)}` : ''}</summary>${rows}</details>`;
}

// Reconcile panes with the latest state: add new sessions, drop ended ones,
// refresh headers, and reorder only when the order actually changed (a DOM
// move resets the pane's scroll position).
function mcSync() {
  if (!mc.open || !lastState) return;
  const live = lastState.liveSessions || [];
  $('#mc-sub').textContent = live.length ? `${live.length} session${live.length === 1 ? '' : 's'} live` : '';
  const grid = $('#mc-grid');
  if (!live.length) {
    mc.panes.clear();
    grid.innerHTML = '<div class="mc-empty">No sessions running. Start one with <code class="mono">claude</code> in any project.</div>';
    return;
  }
  const empty = grid.querySelector('.mc-empty');
  if (empty) empty.remove();
  const seen = new Set();
  for (const s of live) {
    seen.add(s.sessionId);
    let pane = mc.panes.get(s.sessionId);
    if (!pane) {
      const el = document.createElement('div');
      el.className = 'mc-pane';
      el.dataset.sid = s.sessionId;
      el.innerHTML = '<div class="mc-pane-head"></div><div class="mc-pane-task" hidden></div><div class="mc-agents"></div><div class="mc-pane-body"><div class="d-empty">Loading…</div></div>';
      pane = { el, offset: 0, st: { lastDay: '' }, loaded: false };
      mc.panes.set(s.sessionId, pane);
      grid.appendChild(el);
    }
    pane.el.classList.toggle('waiting', s.status === 'waiting');
    const head = pane.el.querySelector('.mc-pane-head');
    patch(head, mcPaneHead(s));
    const taskEl = pane.el.querySelector('.mc-pane-task');
    const rl = s.status === 'waiting' ? reasonLine(s.waitingReason) : null;
    const taskHtml = rl
      ? `<span class="prompt-ch" style="color:var(--warn)">${rl.glyph || '›'}</span>${esc(rl.short)}`
      : s.currentTask ? `<span class="prompt-ch">❯</span>${esc(s.currentTask.activeForm)}` : '';
    patch(taskEl, taskHtml);
    taskEl.hidden = !taskHtml;
    const agentsEl = pane.el.querySelector('.mc-agents');
    patch(agentsEl, agentTree(s.agents, { collapsible: true, key: s.sessionId }));
  }
  for (const [id, pane] of mc.panes) {
    if (!seen.has(id)) { pane.el.remove(); mc.panes.delete(id); }
  }
  const desired = live.map((s) => s.sessionId);
  const current = [...grid.children].map((c) => c.dataset.sid);
  if (desired.join() !== current.join()) {
    const scrolls = new Map(desired.map((id) => [id, mc.panes.get(id).el.querySelector('.mc-pane-body').scrollTop]));
    for (const id of desired) grid.appendChild(mc.panes.get(id).el);
    for (const id of desired) mc.panes.get(id).el.querySelector('.mc-pane-body').scrollTop = scrolls.get(id);
  }
}

async function mcPoll() {
  if (!mc.open || mc.polling) return;
  mc.polling = true;
  try {
    await Promise.all([...mc.panes.entries()].map(async ([id, pane]) => {
      try {
        const url = `/api/session?id=${encodeURIComponent(id)}${pane.loaded ? `&after=${pane.offset}` : ''}`;
        const r = await fetch(url);
        if (!r.ok) return;
        const t = await r.json();
        pane.offset = t.nextOffset;
        const body = pane.el.querySelector('.mc-pane-body');
        if (!pane.loaded) {
          pane.loaded = true;
          body.innerHTML = transcriptHtml(t.events.slice(-40), pane.st) || '<div class="d-empty">Nothing yet.</div>';
          body.scrollTop = body.scrollHeight;
        } else if (t.events.length) {
          const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 160;
          body.insertAdjacentHTML('beforeend', transcriptHtml(t.events, pane.st));
          while (body.children.length > 300) body.firstChild.remove();
          if (nearBottom) body.scrollTop = body.scrollHeight;
        }
      } catch { /* transient; next tick retries */ }
    }));
  } finally {
    mc.polling = false;
  }
}

$('#mc-btn').addEventListener('click', openMissionControl);
$('#mc-close').addEventListener('click', closeMissionControl);
$('#mc-grid').addEventListener('toggle', (e) => {
  const d = e.target.closest('details[data-agents-key]');
  if (d) localStorage.setItem(`agentsOpen:${d.dataset.agentsKey}`, d.open ? '1' : '0');
}, true);

// ---------- hive ----------
// One character card per live session: a generated face, a personality the
// server earned from real behaviour, rank by spend, and the latest tool call.
const hive = { open: false, timer: null, trail: new Map(), ranks: new Map(), hues: new Map() };

function hvHash(str) {
  let h = 2166136261;
  for (const c of String(str)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  // Finalizer: ids that share a long prefix still land far apart.
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}

// Twelve hues spaced so neighbours on the board read as different colours.
const HV_HUES = [4, 28, 46, 88, 140, 168, 192, 214, 236, 262, 292, 330];
function hvHue(id) {
  return hive.hues.get(id) ?? HV_HUES[hvHash(id) % HV_HUES.length];
}

// Each session keeps its own hue unless an earlier-started live session
// already wears it; then it takes the next free one.
function hvAssignHues(live) {
  hive.hues = new Map();
  const used = new Set();
  for (const s of live.slice().sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0))) {
    let i = hvHash(s.sessionId) % HV_HUES.length;
    for (let k = 0; k < HV_HUES.length && used.has(i); k++) i = (i + 1) % HV_HUES.length;
    used.add(i);
    hive.hues.set(s.sessionId, HV_HUES[i]);
  }
}

// A small robot face, the same one every time for the same session.
function hvAvatar(id, status) {
  const h = hvHash(id);
  const col = `hsl(${hvHue(id)} 52% 58%)`;
  const eye = status === 'waiting' ? 'var(--warn)' : 'var(--ink)';
  const ant = [
    `<line x1="28" y1="12" x2="28" y2="5" stroke="${col}" stroke-width="2"/><circle cx="28" cy="4.5" r="3" fill="${col}"/>`,
    `<line x1="21" y1="12" x2="16" y2="5" stroke="${col}" stroke-width="2"/><line x1="35" y1="12" x2="40" y2="5" stroke="${col}" stroke-width="2"/><circle cx="16" cy="4.5" r="2.2" fill="${col}"/><circle cx="40" cy="4.5" r="2.2" fill="${col}"/>`,
    `<rect x="3" y="25" width="5" height="10" rx="1.5" fill="${col}"/><rect x="48" y="25" width="5" height="10" rx="1.5" fill="${col}"/>`,
  ][(h >>> 9) % 3];
  const eyes = [
    `<circle cx="22" cy="27" r="3.2"/><circle cx="34" cy="27" r="3.2"/>`,
    `<rect x="19.5" y="24.5" width="5" height="5"/><rect x="31.5" y="24.5" width="5" height="5"/>`,
    `<rect x="17" y="25" width="22" height="4" rx="2"/>`,
    `<circle cx="28" cy="27" r="4.6"/>`,
  ][(h >>> 11) % 4];
  const mouth = [
    `<line x1="22" y1="36" x2="34" y2="36" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`,
    `<path d="M22 34.5 Q28 39.5 34 34.5" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`,
    `<rect x="21" y="34.5" width="3.5" height="3" fill="${col}"/><rect x="26.25" y="34.5" width="3.5" height="3" fill="${col}"/><rect x="31.5" y="34.5" width="3.5" height="3" fill="${col}"/>`,
    `<circle cx="28" cy="36" r="2.2" fill="${col}"/>`,
  ][(h >>> 13) % 4];
  const rx = (h >>> 15) % 2 ? 11 : 4;
  return `<svg class="hv-avatar" viewBox="0 0 56 56" aria-hidden="true">${ant}
    <rect x="8" y="12" width="40" height="38" rx="${rx}" fill="${col}"/>
    <rect x="13" y="18" width="30" height="24" rx="3" fill="var(--bg)"/>
    <g class="eyes" fill="${eye}">${eyes}</g>${mouth}</svg>`;
}

function hvAgo(at) {
  if (!at) return '';
  const sec = Math.max(0, Math.floor((Date.now() - at) / 1000));
  if (sec < 5) return 'just now';
  if (sec < 60) return `${sec}s ago`;
  return relTime(at);
}

function hvBar(label, value, pct, level = '') {
  const w = Math.max(0, Math.min(100, Number(pct) || 0));
  return `<div class="hv-bar ${level}"><div class="row"><span>${label}</span><b>${value}</b></div>
    <div class="track"><span class="fill" style="width:${w}%"></span></div></div>`;
}

function hvTiles(live) {
  const spend = live.reduce((n, s) => n + (s.estCost || 0), 0);
  const burn = live.reduce((n, s) => n + (s.burnRate || 0), 0);
  const waiting = live.filter((s) => s.status === 'waiting');
  const longest = Math.max(0, ...waiting.map((s) => s.waitingMin || 0));
  const tile = (k, v, sub, cls = '') => `<div class="hv-tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const out = [
    tile('Live', live.length, `${live.length - waiting.length} working · ${waiting.length} need you`),
    tile('Spend', fmtCost(spend) || '$0', esc(costWording().noun)),
    tile('Burn', `$${Math.round(burn)}/h`, 'live sessions combined'),
    tile('Needs you', waiting.length, waiting.length ? (longest ? esc(waitLabel(longest)) : 'just asked') : 'nobody is waiting', waiting.length ? 'warn' : ''),
  ];
  const q = lastState.quota;
  if (q && !q.stale && q.utilization != null) {
    const f = lastState.forecast && lastState.forecast.session;
    const sub = f && f.hitAt ? `<span class="eta">→ ${esc(fmtWhen(f.hitAt))}</span> at this pace` : 'on pace to last the window';
    out.push(tile('5-hour limit', `${Math.round(q.utilization)}%`, sub, q.utilization >= 80 ? 'warn' : ''));
  }
  return out.join('');
}

function hvCard(s, total) {
  const r = s.hive || {};
  const prevRank = hive.ranks.get(s.sessionId);
  hive.ranks.set(s.sessionId, r.rank);
  const flip = prevRank != null && prevRank !== r.rank ? ' flip' : '';
  const gap = r.rank === 1
    ? (total.count > 1 ? '<div class="gap lead">leading</div>' : '')
    : r.behind != null ? `<div class="gap">$${r.behind.toFixed(2)} behind</div>` : '';
  const w = costWording();
  const rl = s.status === 'waiting' ? reasonLine(s.waitingReason) : null;
  const stateTxt = rl ? `${rl.glyph ? rl.glyph + ' ' : ''}${rl.short}`
    : s.status === 'waiting' ? 'waiting for you'
    : s.quietMin ? `no output for ${s.quietMin}m`
    : s.background && s.background.detail ? `↳ ${s.background.detail}`
    : `${elapsed(s.startedAt)} on the clock`;
  const a = s.lastAction;
  const fresh = a && a.at && Date.now() - a.at < 10000 ? ' fresh' : '';
  const call = a
    ? `<div class="hv-call${fresh}"><span class="verb">${esc(a.verb)}</span><span class="tgt" title="${esc(a.target)}">${esc(a.target)}</span></div>`
    : '<div class="hv-call"><span class="verb">no tool calls yet</span></div>';
  const trail = (hive.trail.get(s.sessionId) || []).slice(0, -1).reverse().slice(0, 3)
    .map((t) => `<div>${esc(t.verb)} ${esc(t.target)}</div>`).join('');
  const ts = s.tasksSummary;
  const task = s.currentTask
    ? `<div class="hv-task"><span class="prompt-ch">❯</span>${esc(s.currentTask.activeForm)}${ts ? ` · ${ts.completed}/${ts.completed + ts.inProgress + ts.pending}` : ''}</div>`
    : '';
  const ctx = s.context;
  const share = total.spend > 0 ? Math.round(((s.estCost || 0) / total.spend) * 100) : 0;
  const started = s.startedAt ? new Date(s.startedAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
  return `<div class="hv-card${s.status === 'waiting' ? ' waiting' : ''}" style="--hue:hsl(${hvHue(s.sessionId)} 52% 58%)">
    <div class="hv-top">
      ${hvAvatar(s.sessionId, s.status)}
      <div class="hv-who">
        <div class="hv-name" data-session="${esc(s.sessionId)}" title="Open the full transcript">${esc(s.title || s.projectName)}</div>

// Remember the last few distinct actions seen while the page is open, so a
// card shows a short trail rather than only the latest call.
function hvRecordTrail(live) {
  const ids = new Set();
  for (const s of live) {
    ids.add(s.sessionId);
    const a = s.lastAction;
    if (!a) continue;
    const list = hive.trail.get(s.sessionId) || [];
    const last = list[list.length - 1];
    if (last && last.verb === a.verb && last.target === a.target) last.at = a.at;
    else {
      list.push({ verb: a.verb, target: a.target, at: a.at });
      if (list.length > 4) list.shift();
      hive.trail.set(s.sessionId, list);
    }
  }
  for (const id of hive.trail.keys()) if (!ids.has(id)) hive.trail.delete(id);
}

function hiveSync() {
  if (!lastState) return;
  const live = lastState.liveSessions || [];
  hvRecordTrail(live);
  if (!hive.open) return;
  hvAssignHues(live);
  $('#hive-sub').textContent = live.length ? `${live.length} session${live.length === 1 ? '' : 's'} live` : '';
  patch($('#hive-tiles'), hvTiles(live));
  if (!live.length) {
    patch($('#hive-grid'), '<div class="hv-empty">No sessions running. Start one with <code class="mono">claude</code> in any project.</div>');
    return;
  }
  const sorted = live.slice().sort((a, b) => ((a.hive && a.hive.rank) || 99) - ((b.hive && b.hive.rank) || 99));
  const total = { count: live.length, spend: live.reduce((n, s) => n + (s.estCost || 0), 0) };
  patch($('#hive-grid'), sorted.map((s) => hvCard(s, total)).join(''));
}

function hvTick() {
  for (const el of document.querySelectorAll('#hive .hv-ago[data-at]')) {
    const at = Number(el.dataset.at);
    if (!at) continue;
    el.textContent = hvAgo(at);
    const call = el.closest('.hv-sec').querySelector('.hv-call');
    if (call) call.classList.toggle('fresh', Date.now() - at < 10000);
  }
}

function openHive() {
  if (hive.open) return;
  closeMissionControl();
  hive.open = true;
  $('#hive').hidden = false;
  if (location.hash !== '#hive') history.replaceState(null, '', '#hive');
  hiveSync();
  hive.timer = setInterval(hvTick, 1000);
}

function closeHive() {
  if (!hive.open) return;
  hive.open = false;
  $('#hive').hidden = true;
  clearInterval(hive.timer);
  hive.timer = null;
  if (location.hash === '#hive') history.replaceState(null, '', location.pathname + location.search);
}

$('#hive-btn').addEventListener('click', openHive);
$('#hive-close').addEventListener('click', closeHive);
if (location.hash === '#hive') openHive();

    if (!r.ok) throw new Error();
    const d = await r.json();
    const hl = q.replace(/\b(project|since):\S+/gi, '').replace(/\s+/g, ' ').trim();
    const t = d.transcripts;

         <span class="s-when" style="margin-left:8px">reads every conversation, not just your prompts</span></div>`;
    $('#d-path').textContent = `${d.prompts.length + d.titles.length + (t ? t.matches.length : 0) + (d.notes || []).length} results — narrow with project:name or since:7d`;
    const titleRows = d.titles.map((t) => `
      <li>

        <span class="s-when">${esc(t.projectName)}</span>

      </li>`).join('');
    const promptRows = d.prompts.map((p) => `
      <li>
        <span class="s-title" ${p.sessionId ? `data-session="${esc(p.sessionId)}" data-hl="${esc(hl)}" title="Click to read the transcript"` : ''}>${esc(p.snippet)}</span>
        <span class="s-when">${esc(p.projectName)}</span>

    const noteRows = (d.notes || []).map((n) => `
      <li>
        <span class="s-title" data-session="${esc(n.sessionId)}" title="${esc(n.note)}"><span class="note-mark">≡</span> ${esc(n.snippet)}</span>
        <span class="s-when">${esc(n.projectName)}</span>
        <span class="s-when">${relTime(n.lastActivityAt)}</span>
      </li>`).join('');
    const chatRows = (d.chats || []).map((m) => `
      <li>
        <span class="s-title" data-chat="${esc(m.chatId)}" data-hl="${esc(hl)}" title="Click to open at this match">${esc(m.snippet)}</span>
        <span class="s-when">${esc(m.name.slice(0, 40))}</span>
        <span class="s-when">${m.ts ? relTime(m.ts) : ''}</span>
      </li>`).join('');
    $('#d-body').innerHTML =
      dSection(`Session titles — ${d.titles.length}`, titleRows ? `<ul class="d-sessions">${titleRows}</ul>` : null, 'No title matches.') +
      dSection(`Prompts — ${d.prompts.length}`, promptRows ? `<ul class="d-sessions">${promptRows}</ul>` : null, 'No prompt matches.') +
      ((d.notes || []).length ? dSection(`Notes — ${d.notes.length}`, `<ul class="d-sessions">${noteRows}</ul>`) : '') +
